 ##Game Concepts
 game_concept_gimilziran: "Gimilattô"
 game_concept_gimilziran_desc: "Gimilattô, known as Elf-Friend, was the would-be founder of the High Kingdom of [thanihazad|E] and a formidable conqueror who, for a time, held vast swaths of the southern [sevenlands|E] under his banner. \n\nHe was raised in [numenor|E] during the rise of the Shadow and became a leader among the [faithful|E] [numenoreans|E] exiled from Andúnië. Believing his life to be a mission in service to [iluvatar|E] and the [valargods|E], Gimilattô sought tirelessly to rekindle the light of [eru|E] among those who had turned away. When the Great Armament was summoned, he defied Ar-Pharazôn's command and fled to Nindamas, where he secretly prepared ships. Warned by his friend [elendil|E] of Amandil's vision of the [downfallofnumenor|E], Gimilattô and his sons narrowly escaped the cataclysm in a small fleet of vessels carrying their followers. He made landfall in Lôni Hîsekhôr, quickly resettling the recently destroyed city with his own [faithful|E] followers. \n\nFrom this refuge, he launched his campaign of conquest. Rallying the survivors of [numenor|E], Gimilattô rapidly took control of the Kingdom of Pél, establishing it as the heart of his new realm. Declaring himself High King of [thanihazad|E], he demanded fealty from the lords of the [sevenlands|E] and called upon them to renounce the ways of the [kingsmen|E]. This bold proclamation, however, proved his undoing. The nascent [balan_lai|E], viewing Gimilattô as both a heretic and an existential threat, launched a full-scale invasion, quickly overwhelming Gimilattô's armies. Within just a century, Gimilattô's dream lay in ruins. He and his son Izinduzôr fell in the bloody Battle of Zâirânak, ending his short-lived reign. Though his grandson, Adûnafazor, attempted to rekindle the flame of his legacy, he too perished in battle just a few years later. Gimilattô's great-grandson, Khibilathôr, secured a period of peace following the decisive victory of the [balan_lai|E], preserving his control over the Kingdom of Pél. However, this stability proved short-lived, as Pél was conquered by the [tamska|E] just over a century into his reign. \n\nThus the the vision of a [faithful|E] [thanihazad|E] was extinguished forever. The war was a total loss, and Gimilattô, along with his son, grandson, and great-grandson were all laid to rest in a hidden tomb deep beneath the newly founded Gimilzîr Estate in Mispír."

 game_concept_batanim: "Batânim"
 game_concept_batanim_desc: "The Batânim are the [faithful|E] [adunaic|E] inhabitants of [thanihazad|E], those who have clung to their beliefs even centuries after the failed conquests of [gimilziran|E]. Long persecuted by the many princes of the [balan_lai|E] throughout the [thirdage|E], they are now few in number and largely outcasts within Kharadûnâi society.\n\nYet they hold their faith, and their devotion to [erutheone|E], above all else. Willing to enduring reprisal, punishment, and whatever trials the world may cast upon them rather than abandon it. As their people say: 'The light of the sun will dim before our faith.'"
 
 ##Nicknames
  nick_bearer_of_light: "Nimruzîr" 
  nick_bearer_of_light_desc: "[gimilziran|E] was often known as Nimruzîr, or Elf Friend, for his attempted conversion of [thanihazad|E] into a land of the [faithful|E], and his friendship with the [cuind|E] [elves|E]. His fervor was legendary, and his devotion to [erutheone|E] was unwavering, which ultimately led to his downfall."

