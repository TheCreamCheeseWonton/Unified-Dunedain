 challenge_character_arugimil: "Ârûgimil of House Gimilzîr"
 challenge_character_arugimil_desc: "In the heartlands of the southern [kingsmen|E] stands House Gimilzîr, the last bastion of the southern [faithful|E] of [thanihazad|E]. As heir to the legacy of [gimilziran|E] and [elros|E] himself, Ârûgimil bears the near-impossible burden of living up to such greatness, all while the rule of his house has been thrust upon him.\n\nWill he rise to lead his family and the [batanim|E] to glory, or be crushed beneath the weight of his own fears?"

 building_wonder_gimilzir_statue: "Onyx Statue of Ârûgimil"
 building_wonder_gimilzir_statue_desc: "A towering statue, forty feet tall, wrought from finely cut black onyx, stands at the heart of Pharasphurus, depicting Ârûgimil Gimilzîr in solemn majesty. Stark and adamant, it overlooks the very city whose rise he was largely responsible for, a silent testament to his enduring legacy.\n\nÂrûgimil was the one who led the [batanim|E] to their new home in Tantûrak, guiding them through uncertainty into destiny. To many among his people, he is more than a king. He is a near-sacred figure, one who preserved the [faithful|E] and drove out the evils that once plagued these Tantûrak.\n\nRaised after his death, this statue has since become a site of pilgrimage for the [batanim|E]. From distant settlements and far-off shores, they come to stand before his likeness, to honor his memory, and to reflect upon the path he carved for his people. In its shadow, his legend endures, rigid as the stone from which it is shaped."
 building_type_wonder_gimilzir_statue: "Onyx Statue of Ârûgimil"
 building_type_wonder_gimilzir_statue_desc: "A towering statue, forty feet tall, wrought from finely cut black onyx, stands at the heart of Pharasphurus, depicting Ârûgimil Gimilzîr in solemn majesty. Stark and adamant, it overlooks the very city whose rise he was largely responsible for, a silent testament to his enduring legacy.\n\nÂrûgimil was the one who led the [batanim|E] to their new home in Tantûrak, guiding them through uncertainty into destiny. To many among his people, he is more than a king. He is a near-sacred figure, one who preserved the [faithful|E] and drove out the evils that once plagued these Tantûrak.\n\nRaised after his death, this statue has since become a site of pilgrimage for the [batanim|E]. From distant settlements and far-off shores, they come to stand before his likeness, to honor his memory, and to reflect upon the path he carved for his people. In its shadow, his legend endures, rigid as the stone from which it is shaped."

 ##Gimilarani
 gimilarani: "Gimilthâni"
 gimilarani_collective_noun: "Gimilthâni"
 gimilarani_prefix: "Gimilthâni"
 gimilarani_ethnicity: "Gimilthâni"
 gimilarani_desc: "#size:15    The [faithful|E|E] of [thanihazad|E] had long lived under the thumb of the [kingsmen|E] Kharadûnâi. Now, however, with the [batanim|E] established in a realm of their own, they have begun to spread their wings, shaping a distinct culture and forging a strong, independent community far from the oppression of the [kingsmen|E].\n\nFrom this cultural awakening have arisen the Gimilthâni, a fervent and devout people. They cling to their [religion|E] with unwavering resolve, ready to follow [eru|E] even into the darkest nights, trusting that light will yet pour forth from the stars. \n\nThough they remain proud of their [numenorean|E] heritage and [adunaic|E] traditions, among all the [adunai|E] they stand apart as the truest heirs to the path of the original [numenoreans|E]. They are determined to reveal the light of [eru|E] to the wider world.#"

 tradition_batanim_name: "Batânim Legacy"
 tradition_batanim_desc: "The [batanim|E], heirs to the legacy of [gimilziran|E], are the last remnant of the dream of a southern [faithful|E] realm. We must endure, placing our trust in our own strength and in one another. For if we falter, that dream, that flame of hope for a [faithful|E] southern [middleearth|E], will perish with us.\n\nWe are the protectors of that flame, and we will fight to ensure it endures until the ending of the world."

 ##Gimilzir Decisions
 decision_group_type_gimilzir_decisions: "Gimilzîr Decisions"

 decision_choose_gimilzir_path: "The Future of House Gimilzîr"
 decision_choose_gimilzir_path_desc: "The future of House Gimilzîr rests in my hands, and the weight of it is not lightly borne. There is much to consider, and each path before me demands careful thought, for none are without risk, and all will shape our fate in ways that cannot be undone.\n\nOnce, my family held dominion over the lands of the [GetTitleByKey('k_pel').GetName], where [gimilziran|E] came ashore and founded his great, if short-lived, kingdom. To reclaim those lands would be to restore what was lost, to root our legacy once more in the soil where it first took hold.\n\nYet another road calls me northward, toward war and reckoning. There, I could take up the struggle begun by my forebear, [GetScriptedCharacterByHistoryID('linegimilzadan01').GetTitledFirstName], and carry the fight to [anbalkumagan|E]. Victory there would not only avenge old wounds, but carve out new lands for me to rule.\n\nOr I may turn away from both, and look instead to the distant east. Beyond the bounds of [thanihazad|E] lie the long-lost lands of Tantûrak, vast and abandoned.  There, I could lead what remains of the [faithful|E] left in [thanihazad|E] to a new beginning, far from the shadows that haunt us here.\n\nEach choice bears its own promise, and its own cost. Whatever path I choose, it will define the destiny of my House for generations to come."
 decision_choose_gimilzir_path_tooltip: "We must choose the future of House Gimilzîr"
 decision_choose_gimilzir_path_confirm: "The future of House Gimilzîr is bright!"
 decision_choose_gimilzir_path_tt: "I will choose the future of House Gimilzîr"

 decision_gimilzir_tanturak_founder_statue: "In Memory of Ârûgimil"
 decision_gimilzir_tanturak_founder_statue_desc: "[GetScriptedCharacterByHistoryID( 'linegimilzadan2' ).GetName] is dead, and many across the realm believe that we must honor the memory of this great man, the savior of the [batanim|E]. It is to him that we owe Tantûrak being made our own, the prosperity we now enjoy, and even our very existence. His deeds demand remembrance worthy of their magnitude.\n\nAnd so, we shall ensure that his legacy endures. A great statue has been commissioned in Pharasphurus, one that will stand as a lasting tribute to his life and accomplishments. The finest [dwarven|E] stonemasons have been summoned from the [yellowmountains|E], their unmatched skill set to the task of carving his likeness from solid onyx, unyielding, eternal, and forever memorialized in stone. \n\nIn this way, his name shall not fade, and his deeds shall be remembered for generations to come."
 decision_gimilzir_tanturak_founder_statue_tooltip: "We must give the great man a proper legacy"
 decision_gimilzir_tanturak_founder_statue_confirm: "Ârûgimil's name will forever be remembered"
 decision_gimilzir_tanturak_founder_statue_tt: "Forever his likeness will be carved into stone"

 decision_gimilzir_adunaic_revival_sarul: "Batânim Settle Sarûl"
 decision_gimilzir_adunaic_revival_sarul_desc: "For thousands of years, [GetTitleByKey('c_sarul').GetNameNoTier] has lain a rotting ruin, slowly decaying, consumed by the ever-encroaching jungle. No longer. Now that the [batanim|E] rule these lands, we shall restore the city to its former splendor and settle many of our people within the great capital of Tantûrak.\n\nSoon, it will stand as the capital of Tantûrak once more, the center of [faithful|E] rule in the Ûsakan Bay. To achieve this, we must first rebuild what has been lost. Only then will the many eager settlers be able to cross the sea and claim their new homes."
 decision_gimilzir_adunaic_revival_sarul_tooltip: "We must settle Sarûl for the good of all Batânim"
 decision_gimilzir_adunaic_revival_sarul_confirm: "The future of Tantûrak is bright!"
 decision_gimilzir_adunaic_revival_sarul_tt: "Soon Sarûl will be a city of the [batanim|E]"
 gimilzir_sarul_tooltip: "[GetTitleByKey('c_sarul').GetNameNoTier] will gain a powerful bonus, along with several free [buildings|E] and increased [development|E]"
 gimilzir_sarul_tooltip_culture: "[GetTitleByKey('c_sarul').GetNameNoTier] will adopt your [culture|E]"
 gimilzir_sarul_tooltip_faith: "[GetTitleByKey('c_sarul').GetNameNoTier] will adopt your [faith|E]"

 decision_continue_adventure_gimilzir_tanturak: "Continue Your Adventure"
 decision_continue_adventure_tanturak_tooltip: "#italic If your current story [task_contract|E] has vanished, you may regain it here."
 decision_continue_adventure_tanturak_desc: "My companions and I still have work to do. We shall not rest until Tantûrak is mine.\n\n#N Only take this decision if you've lost your current story contract#!!"
