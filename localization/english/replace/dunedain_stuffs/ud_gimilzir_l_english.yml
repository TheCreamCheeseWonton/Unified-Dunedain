 dynn_gimilzadan_motto: "[Glossary('Anâm nakhô Bârazra sakalada, phazagada, magada, azarada, katha gimilî nâluthôr.', 'gimils_pledge_gloss' )]"

 ##Gloss
 gimils_pledge_gloss: "[adunaic|E] #bold Anâm nakhô Bârazra sakalada, phazagada, magada, azarada, katha gimilî nâluthôr.#! \n\nThus spoke [gimilziran|E], upon his landing in [middleearth|E] after the [akallabeth|E]; vowing: 'Out of the Great Sea we rose, to rule, to shape, to shine, like stars born of shadow.'"
