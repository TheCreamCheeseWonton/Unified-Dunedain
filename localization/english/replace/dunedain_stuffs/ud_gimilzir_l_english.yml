 ##Gimilzir Events

 gimilzir_events.2.t: "The Rise of House Gimilzîr"
 gimilzir_events.2.desc: "House Gimilzîr has always been a small, insular, but close-knit family. Taking care of their own, not interacting much with those outside their estate in [GetTitleByKey('c_mispir').GetNameNoTier]. Able to trace their bloodline back to [elrosshort|E] himself, they retain some of the purest [bloodofnumenor|E] in all of [thanihazad|E] which has afforded them some amount of renown. After [gimilziran|E]'s failed conquests in the early [thirdage|E], this is how the family lingered. Rotting as their ancient estate built after their exile from [GetTitleByKey('k_pel').GetNameNoTier], gathered dust and slowly crumbled away.\n\nHowever, [GetScriptedCharacterByHistoryID( 'linegimilzadan01' ).GetFirstNameNicknamed] Gimilzîr, changed the tune of the family forever. The [stormhost|E] invaded [thanihazad|E] early in the man's life, and returning the call of the [balan_lai|E], [GetScriptedCharacterByHistoryID( 'linegimilzadan01' ).GetFirstNameNicknamed] came to their aid as a Knight of Kharadûne. During a seige on [GetTitleByKey('c_mispir').GetNameNoTier], the ancient Estate of Gimilzîr, was raised and reduced to rubble by the [stormhost|E] army. Since that day the Gimilzîr family has been without a proper estate, following the head of their House wherever they may go. [GetScriptedCharacterByHistoryID( 'linegimilzadan01' ).GetFirstNameNicknamed] fought valiantly and served for most of his life, becoming the personal champion of [GetScriptedCharacterByHistoryID( 'lineofgimilthani47' ).GetFirstNameNicknamed]. He won the Gimilzîr family much honor with his many great deeds in those days, of which he is remembered quite fondly by all who knew him. \n\nMuch like his grandfather before him, [GetScriptedCharacterByHistoryID( 'linegimilzadan1' ).GetFirstNameNicknamed] also joined the Knights at the age of 24. There he rose through the ranks at lightning speed. He quickly made a name for himself as one of the greatest knights in the history of [thanihazad|E], with some even saying he rivaled his Grandfather. However, after a particularly bad wound, and the news of his newborn son, [GetScriptedCharacterByHistoryID( 'linegimilzadan1' ).GetFirstNameNicknamed] left the knights to see after his family. Now, at the young age of 19 [GetScriptedCharacterByHistoryID( 'linegimilzadan2' ).GetFirstNameNicknamed] was gifted by his father the honor of becoming head of House Gimilzîr.\n\nThe young man was not ready for such a great responsibility, fearing he would let down his family and fail to rise to the great heights of his Father and Great-Grandfather. He did not even dare think of even approaching the brilliance of [gimilziran|E]. [GetScriptedCharacterByHistoryID( 'linegimilzadan1' ).GetFirstNameNicknamed] nonetheless believes in his son and sees him as a true heir of [numenor|E], with the wits and grace to forge a destiny greater than any other in House Gimilzîr, and to possibly, even fulfill the lamented dream of [gimilziran|E]."
  gimilzir_events.2.a: "We all have hope in the young [GetScriptedCharacterByHistoryID( 'linegimilzadan2' ).GetFirstNameNicknamed]!"

  gimilzir_events.3.t: "Am I worthy?"
  gimilzir_events.3.desc: "Anxiety grips my heart with each passing dawn, as another day of leading my family stretches before me like an unending road. This burden was never one I sought, nor one I believed myself capable of bearing. I am no leader, no soldier, no warrior, no great statesman or silver-tongued diplomat. I am just... Ârûgimil. An unworthy heir to far greater sires, a shadow cast by the weight of their legacy.\n\nAnd yet, here I stand as head of my House. All who bear my name now look to me, their hopes and fears resting upon my shoulders. All trusting that I will guide them out of our withering darkness. I feel that weight in every word I speak, every choice I make. It presses upon me in quiet moments, whispering of my doubts, of my failings, of how easily I might falter.\n\nStill, I am not alone. My parents stand beside me, offering counsel, strength, and patience far beyond what I deserve. And [GetScriptedCharacterByHistoryID( 'linegimilethtwocustom2' ).GetFirstName], my steadfast friend, listens when the silence grows too heavy, when my thoughts turn against me. Without them, I fear I would have crumbled already beneath the strain of it all.\n\nI am an heir to [elros|E] himself. That truth both humbles and terrifies me. Such a lineage is no small thing, it is a flame that must be carried, not allowed to gutter and fade. I do not yet know if I possess the strength to live up to it... but I must try. I must prove it to them, to my family, to those who believe in me.\n\nMost of all, I must prove it to myself."
  gimilzir_events.3.a: "They place their hope in me, but I have none in myself."
  enable_gimilzir_decision: "Once you attain [prestige_level|E] @prestige_level_3_icon![GetModifier('prestige_level_3').GetNameWithTooltip|L], you will be able to choose House Gimilzîr's path forward"

  gimilzir_events.30.t: "I am worthy?"
  gimilzir_events.30.desc: "I have led my family for some time now, and in doing so have earned us a measure of prestige. My deeds are spoken of throughout [thanihazad|E], and my name is known to many. Yet it has not all been triumph and light. My anxiety endures, and the fear of failing those I love remains as sharp as ever.\n\nThe thought that my choices may bring harm to someone dear to me weighs heavily on my mind. Doubt lingers in the shadows, even as my actions seem to defy it, and each day feels like a quiet struggle, against both the world and myself.\n\nMore than that, I find myself measured against [gimilziran|E] and [elrosshort|E], whose blood runs in my veins, and I cannot help but feel wanting. I am heir to [numenor|E], and yet I feel as though I am but a child in the dirt, accomplishing little beside the greatness of their legends."
  gimilzir_events.30.a: "Will this ever come to an end?"

  gimilzir_events.31.t: "Growing Confidence"
  gimilzir_events.31.desc: "House Gimilzîr has grown far more prosperous in these past years under my leadership. Night after night, my father, [GetScriptedCharacterByHistoryID( 'linegimilzadan1' ).GetFirstNameNicknamed], speaks with pride, insisting that his choice to entrust me with our house has been proven right time and again, and that pride, once distant, has begun to take root within me as well.\n\nWith each success, his words have started to ring truer. My thoughts have grown clearer, my voice more certain, and the path forward no longer feels so obscured. Though anxiety still lingers, and comparisons to [elrosshort|E] weigh heavily on my mind, I find myself at last growing into the role I once feared, steadier, more assured, and increasingly worthy of leading House Gimilzîr."
  gimilzir_events.31.a: "Maybe this isn't so bad after all..."

  gimilzir_events.32.t: "Maybe I am worthy"
  gimilzir_events.32.desc: "Today I woke, ready to meet the day’s work, when a realization struck me so suddenly that it halted me where I stood. In that quiet moment, I understood something I had not thought possible, I no longer fear my role as leader.\n\nWhen I give a decree, my thoughts no longer spiral with anxious doubt over what may follow. When I shape the future of my family, I speak with a steady voice, certain of the path before us. The ever-present weight of uncertainty, which once pressed upon every choice, has eased, replaced by a calm resolve I scarcely recognize as my own.\n\nIf the Ârûgimil of only a few years past could see me now, I doubt he would know me at all. The burdens I carry have not lessened, but I have grown strong enough to bear them without faltering.\n\nAnd so I walk toward my family with a clear mind and steady heart, assured not only in my decisions, but in myself. At last, I feel I lead not in the shadow of my ancestors, but alongside their memory, guiding House Gimilzîr with a grace that, in some small way, reflects their own."
  gimilzir_events.32.a: "I am fit to lead House Gimilzîr"

  gimilzir_events.33.t: "The Sainly Life of Ârûgimil"
  gimilzir_events.33.desc: "I have, throughout my long life, brought much glory to the [batanim|E], and lived a life devoted to the constant spreading of the good word of [eru|E] throughout the land. In every place I have traveled, I have sought to be a humble instrument of his will, carrying his light into shadowed regions and offering guidance to those who had never before heard his name spoken with reverence.\n\nThrough my piety, perseverance, and unwavering effort, [ROOT.Char.GetFaith] has grown in strength and influence, extending its reach far beyond what many once believed possible. It has taken root and flourished across the lands of southern [middleearth|E], where once doubt and ignorance prevailed.\n\nMany say, and I do not deny the weight of such words, that I have done more for the [faithful|E] cause in these lands than anyone who came before me. In places where the name of [erutheone|E] was once unknown or forgotten, I have helped rekindle remembrance of his divine presence, bringing light to regions long accustomed to darkness. \n\nAnd yet, for all that has been accomplished, I am ever mindful that my work is but a small reflection of a far greater will. Through these labors, I feel myself drawn ever closer to [eru|E], as though each act of devotion lifts the veil a little more between the mortal and the eternal.\n\nIt is my deepest hope that [eruiluvatar|E] may look upon my deeds with favor, and find them worthy of approval in his boundless wisdom. For though I have striven tirelessly in his name, I remain but a servant seeking to be judged not by greatness of self, but by sincerity of devotion."
  gimilzir_events.33.a: "May I live long and prosper"
  gimilzir_events.33.b: "May I see my house flourish"


  gimilzir_events.4.t: "The Path Forward for House Gimilzîr"
  gimilzir_events.4.desc1: "After much time, effort, and more than a fair share of anxiety, I have done what once seemed impossible. I have proven myself wrong, and my family right. In my stewardship, I have brought glory and renown to our name, and wealth and plenty to my house. Not since the early [thirdage|E] has House Gimilzîr known such prosperity or such standing among the realms. \n\nThough it is difficult for me to believe, much of our glory has come through my own command, and even I cannot deny what has been achieved. Where once there was doubt, there is now recognition. Where once there was uncertainty, there is now influence. And yet, prosperity has not quieted ambition. On the contrary, it has stirred it. Within House Gimilzîr, voices now speak not of survival, but of destiny, of what we might yet become.\n\nSome look back to what was lost, and demand its restoration. They urge us to reclaim [GetTitleByKey('k_pel').GetNameNoTier], and perhaps even all of [GetTitleByKey('e_thani_hazad').GetNameNoTier]. To finally realize the long-faded dream of [gimilziran|E] and restore what our line once reached for, but never fully held.\n\nOthers still hardened by the memory and loss of our old estate in [GetTitleByKey('c_mispir').GetNameNoTier] demand vengeance. They speak of [anbalkumagan|E], and of settling the score by taking their lands and breaking their power once and for all. Finally saving the [sevenlands|E] from their evil and depravity."
  gimilzir_events.4.desc2: "After much time and effort, I have done what once seemed impossible. In my stewardship, I have brought glory and renown to our name, and wealth and plenty to my house. Not since the early [thirdage|E] has House Gimilzîr known such prosperity or such standing among the realms. \n\nWhere once there was doubt, there is now recognition. Where once there was uncertainty, there is now influence. And yet, prosperity has not quieted ambition. On the contrary, it has stirred it. Within House Gimilzîr, voices now speak not of survival, but of destiny, of what we might yet become.\n\nSome look back to what was lost, and demand its restoration. They urge us to reclaim [GetTitleByKey('k_pel').GetNameNoTier], and perhaps even all of [GetTitleByKey('e_thani_hazad').GetNameNoTier]. To finally realize the long-faded dream of [gimilziran|E] and restore what our line once reached for, but never fully held.\n\nOthers still hardened by the memory and loss of our old estate in [GetTitleByKey('c_mispir').GetNameNoTier] demand vengeance. They speak of [anbalkumagan|E], and of settling the score by taking their lands and breaking their power once and for all. Finally saving the [sevenlands|E] from their evil and depravity."
  gimilzir_events.4.desc3: "\n\nAnd then there are those more cautious, those who see danger in both pride and revenge. They counsel departure instead, that we leave [thanihazad|E] behind entirely, gather what remains of the [batanim|E], and seek fortune elsewhere. A new beginning, far from the shadow of past failures and the enemies that still linger here in [thanihazad|E].\n\nAll of them now turn to me. The weight of choice rests where it always has, upon my shoulders. And whatever path I choose, it will not merely shape the present. It will define what House Gimilzîr becomes for generations."
  gimilzir_events.4.desc4: "\n\nAll of them now turn to me. The weight of choice rests where it always has, upon my shoulders. And whatever path I choose, it will not merely shape the present. It will define what House Gimilzîr becomes for generations."
  gimilzir_events.4.a: "Pél was [GetScriptedCharacterByHistoryID('linegimilzadan08').GetTitledFirstNamePossessive] and so it shall me mine"
  choose_gimilzir_path_tt_1: "You will gather allies and strength to support your conquest of [GetTitleByKey('k_pel').GetNameNoTier]"
  gimilzir_events.4.b: "An-Balkûmagân is an enemy of all that is good"
  choose_gimilzir_path_tt_2: "You will gather allies and strength to support your conquest of [anbalkumagan|E]."
  gimilzir_events.4.c: "I shall find a new homeland for my people"
  choose_gimilzir_path_tt_3: "You will gather all the remaining [faithful|E] in [thanihazad|E] and set sail for a new homeland"
  gimilzir_events.4.d: "I quite like the adventurer life..."
  choose_gimilzir_path_tt_4: "You will forge your own path forward, without any guidance"
  gimilzir_events.4.e: "I need more time to think"
  choose_gimilzir_path_tt_5: "You will choose at a different time"

