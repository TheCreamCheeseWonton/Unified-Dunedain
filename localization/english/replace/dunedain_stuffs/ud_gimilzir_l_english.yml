 gimilzir_no_more_faithful_desc: "With the local Batânim gone, the people feel more at ease, no longer unsettled by their presence."

 gimilzir_tanturak_knights_modifier: "Faithful Knights"
 gimilzir_tanturak_knights_modifier_desc: "A number of faithful Knights of Kharadûne follow this character"

  gimilzir_events.7.t: "Towards a New Home"
  gimilzir_events.7.desc: "Ever since the defeats of [gimilziran|E] and the loss of [GetTitleByKey('k_pel').GetNameNoTier] to the [tamska|E], the [faithful|E] of [thanihazad|E] have had no homeland to call their own. They now live scattered among the Kharadûnâi, often regarded as lesser than their [kingsmen|e] neighbors, and at times subjected to outright persecution. Those few [batanim|E] who remain today, though steadfast in their beliefs, endure life as religious outcasts within Kharadûnâi society, or else conceal their faith for fear of reprisal.\n\nThough this has brought great suffering upon my people, it has also led many within [thanihazad|E] to see them as burdens best cast aside. With careful persuasion, they may be convinced to allow me to gather the [faithful|E] and lead them away, to a new homeland. One we may call our own, far from the oppression we have long endured."
  gimilzir_events.7.a: "But where could our new homeland truly be?"

  gimilzir_events.71.t: "Tantûrak?"
  gimilzir_events.71.desc: "While it may at first seem unconventional, even ironic, given the dark and truly evil legacy of that forsaken realm of [black_numenoreans|E], Tantûrak may yet prove an ideal site for a new homeland. Much of south-eastern [middleearth|E] is already thickly settled, its broad lands claimed by many peoples, yet the regions about the Bay of Ûsakan remain largely empty. The few [men|E] who dwell there, scattered in decentralized tribal societies, could be readily brought into loyal service.\n\nMore promising still is the presence of the [kinnlai|E], elves with whom we might forge enduring alliances and true friendship.\n\nThough the journey would be long, arduous, and fraught with uncertainty, this path offers the [batanim|E] a future in which they may finally possess a land of their own. A realm not of ceaseless war, but of peace and prosperity. It may lack the glory of the other roads before us, yet I cannot help but see it as the wisest of them all."
  gimilzir_events.71.a: "The lost realm of Tantûrak shall be the home of my people"
  gimilzir_events.71.b: "No, this isn't the path forward!"
  gimilzir.71.tt_1: "You will petition the many lords of the [balan_lai|E], seeking leave to lead your people out of [thanihazad|E]"
  gimilzir.71.tt_2: "A #high Story Contract#! becomes available"
  gimilzir.71.tt_3: "You will choose a different path"

  gimilzir_events.701.t: "Meeting [inzilloniholder.GetTitledFirstName]"
  gimilzir_events.701.desc: "As I entered the throne room before [inzilloniholder.GetTitledFirstName], my heart beat like a drum. Everything I hope to achieve rests on this moment, and I dread what may be lost should I fail. I dropped to one knee before the Phazân, bowing my head in due respect. A fleeting thought brought the faintest smile. Perhaps, one day, it will be I who is bowed to.\n\n“Rise,” he commanded. “Now tell me, what plight brings you before me?”\n\n“My [inzilloniholder.GetLadyLord],” I said, standing once more, “my people, the [batanim|E], have long dwelt in these lands. We have endured much hardship at the behedst of the princes of [GetTitleByKey('k_kharadune').GetNameNoTier], and too often face scorn from our fellow Kharadûnâi. We no longer feel welcome here. I ask that you grant those [batanim|E] within your lands leave to depart with me, that we might found a realm of our own.”\n\n[inzilloniholder.GetSheHe|U] seemed taken aback, but quickly replied, “Many among the [batanim|E] serve as loyal knights and soldiers, why should I allow them to leave?”\n\nI paused for a moment, gathering my thoughts before answering." 
  gimilzir_events.701.a: "The Batânim are few, their presence aid you little"
  gimilzir_events.701.b: "I'm sure some coin is more than enough reason"
  gimilzir_events.701.c: "You offer a frivolous reply, already having a better method in mind...."
  gimilzir_events.701.d: "Your right, my [inzilloniholder.GetLadyLord], I'm sorry to have had bothered you"
  gimilzir_events.701.a.tt: "You will attempt to smuggle the Batânim out of Inzillôni"

  gimilzir_events.701.a.success: "[inzilloniholder.GetTitledFirstNameNoTooltip] is Convinced"
  gimilzir_events.701.a.failure: "[inzilloniholder.GetTitledFirstNameNoTooltip] is Unconvinced"

  gimilzir_events.702.t: "[inzilloniholder.GetTitledFirstName] Agrees!"
  gimilzir_events.702.desc: "I can scarcely believe it, [inzilloniholder.GetFirstName] has agreed to let me take the [batanim|E] of [GetTitleByKey('c_inzilloni').GetNameNoTier]! Already, many [faithful|E] families are packing their belongings and following me out of the city, with more joining them by the hour.\n\nThe hope on their faces, hope for a better tomorrow, fills my heart with joy. I am doing something meaningful here, guiding my people toward a brighter future. Though they are but a small part of the [faithful|E] of [thanihazad|E], they mark the true beginning of my journey to Tantûrak. In time, many more will follow in their footsteps." 
  gimilzir_events.702.a: "The first step towards a new home has been made"
  gimilzir_events_story_contract: "A #high Story Contract#! becomes available"
  add_more_settlers_gimilzir: "The local #high Batânim#! population will #high join#! you"

  gimilzir_events.703.t: "[inzilloniholder.GetTitledFirstName] has Refused!"
  gimilzir_events.703.desc: "Anger and disappointment swell within me, spilling into rage. How could [inzilloniholder.GetTitledFirstName] do this? The [batanim|E] are my people, mine to lead. The Kharadûnâi show us no true respect, so why cling to us so jealously as subjects?\n\nI shake my head, but it does little to cool the fire in my chest. And then it strikes me, there is another way. I do not need [inzilloniholder.GetTitledFirstNamePossessive] permission. I can take my people and leave as I choose.\n\nThe [batanim|E] will follow me, even against their [inzilloniholder.GetLadyLord], if it means a future of freedom beyond these detestable [kingsmen|E]. Though smuggling so many out of [inzilloniholder.GetTitledFirstNamePossessive] grasp would be perilous, it may be my only chance to free my people from the clutches of the [balan_lai|E]."
  gimilzir_events.703.a: "The Batânim are mine, whether [inzilloniholder.GetTitledFirstName] likes it or not!"
  gimilzir_events.703.b: "It isn't worth the risks"
  gimilzir_events.703.a.tt: "You will attempt to smuggle your people out of [GetTitleByKey('c_inzilloni').GetNameNoTier]"

  gimilzir_events.704.t: "Smuggling the Batânim"
  gimilzir_events.704.desc: "I have decided to do the unthinkable, steal an entire city, or at least part of one. The [batanim|E] of [GetTitleByKey('c_inzilloni').GetNameNoTier] have endured far too long as lesser subjects, and now they will be freed, whether I must obey the law or not.\n\nThough the [batanim|E] are nominally under [inzilloniholder.GetTitledFirstName], if I construct a great enough scheme, what power would he truly have to stop us? The [batanim|E] are a rowdy, fiercely independent people, and convincing them to join such a bold plan should not be difficult.\n\nSoon, they will all be free of these unjust rulers."
  gimilzir_events.704.a: "Do it, for Eru"
  gimilzir_events.704.b: "Maybe this isnt such a good idea after all..."

  gimilzir_events.704.a.success: "You will succeed in smuggling your people out of [GetTitleByKey('c_inzilloni').GetNameNoTier]"
  gimilzir_events.704.a.failure: "You will fail to smuggle your people out of [GetTitleByKey('c_inzilloni').GetNameNoTier]"

  gimilzir_events.705.t: "Knights of Kharadûne"
  gimilzir_events.705.desc: "Of the many [batanim|E] who have joined me from [GetTitleByKey('c_inzilloni').GetNameNoTier], a not insignificant number are Knights of Kharadûne, renowned for their bravery, skill in battle, and gallantry. To have such warriors at my side would be a great boon. And as fate would have it, several now stand before me.\n\n“Sir, we wish to join your camp as your personal knights,” the foremost among them began. “We believe in your cause and would serve you however we can. Since childhood, I have dreamed that we [faithful|E] might one day have a land of our own, and with you, that dream may yet be realized.”\n\n“Please,” another added, “let us join your entourage, that we might help free all those [batanim|E] who still remain under the grasp of the [balan_lai|E].”" 
  gimilzir_events.705.a: "Of course you may serve"
  gimilzir_events.705.b: "You would better be used protecting the people"
  gimilzir_events.705.b.tt: "They leave, disappointed"

  gimilzir_events.706.t: "Never Suspected a Thing"
  gimilzir_events.706.desc: "Everything went perfectly. Contacts had been made, word spread throughout the [faithful|E] quarters, and a time and place set for the plan to begin.\n\nLate at night, several [batanim|E] loyal to the cause sparked a commotion at the docks, setting a few merchant vessels ablaze before swiftly joining the rest of our people along the southern wall. While the guards were drawn to the chaos, the [faithful|E] slipped from the city through a small gate along the southern walls of the city, lightly guarded even in the best of times.\n\nBy the time [inzilloniholder.GetTitledFirstName] became aware of the sudden disappearance of his [batanim|E] subjects, we were already miles away, beyond reach of any reprisal."
  gimilzir_events.706.a: "The Faithful will have their home!"

  gimilzir_events.707.t: "Caught!"
  gimilzir_events.707.desc: "Everything was in place. Contacts had been made, word spread throughout the [batanim|E] quarters, and a time and place set for the plan to begin. We were to spark a commotion at the harbor, drawing the guards away while the [faithful|E] slipped out through a side gate in the southern walls of [GetTitleByKey('c_inzilloni').GetNameNoTier].\n\nIt was all proceeding perfectly, until, mere hours before our departure, my camp was suddenly swarmed by guards unmistakably sent by [inzilloniholder.GetTitledFirstName]. They knew.\n\nThere was no longer any hope of slipping the [faithful|E] beyond those walls. We had to flee, and with that, any chance of bringing them with us was lost."
  gimilzir_events.707.a: "How could this have happened..."


  gimilzir_events.711.t: "Meeting [azaridethholder.GetTitledFirstName]"
  gimilzir_events.711.desc: "Once again, I entered the throne room of a [balan_lai|E] prince. I kneel before [azaridethholder.GetTitledFirstName], and though still nerve-wracking, it no longer feels quite as overwhelming as before.\n\n“Stand, son of [gimilziran|E],” he said. “Tell me, why have you come before me today?”\n\n“My [azaridethholder.GetLadyLord],” I replied as I rose, “I am of the [batanim|E], and I am leading my people on a long journey toward a new homeland far to the east. We have long endured scorn from our fellow Kharadûnâi, and we no longer feel welcome here in [thanihazad|E]. I believe a new home would serve all better in the end. We know that to many within the [balan_lai|E], our presence is a source of frustration, and so I ask that you allow your [batanim|E] subjects to depart with me, so that we may found a realm of our own.”\n\n[azaridethholder.GetSheHe|U] nodded slowly. “While your faith is... less than ideal, your people still provide me with valuable service. Why, then, should I permit them to leave?”" 
  gimilzir_events.711.a: "The Batânim's presence here only causes disunity"
  gimilzir_events.711.b: "I'm sure some coin is more than enough reason"
  gimilzir_events.711.c: "You offer a frivolous reply, already having a better method in mind...."
  gimilzir_events.711.d: "Your right, my [azaridethholder.GetLadyLord], I'm sorry to have had bothered you"
  gimilzir_events.711.b.tt: "You will attempt to smuggle the Batânim out of Azarîdêth"

  gimilzir_events.711.a.success: "[azaridethholder.GetTitledFirstNameNoTooltip] is Convinced"
  gimilzir_events.711.a.failure: "[azaridethholder.GetTitledFirstNameNoTooltip] is Unconvinced"

  gimilzir_events.712.t: "[azaridethholder.GetTitledFirstName] Agrees!"
  gimilzir_events.712.desc: "Optimism fills the heart, my face spreading into a grin as [azaridethholder.GetFirstName] agrees to let me depart with the [batanim|E] of [GetTitleByKey('c_azarideth').GetNameNoTier], alongside my followers. Already, many [faithful|E] families have packed their belongings and joined me as I leave the fortress, with more gathering to us by the hour.\n\nOnce again, I see what is so rarely found upon a [batanim|E] face, hope. The [faithful|E] who follow my lead grow in number, marching toward a better future. Though those who have joined me today are but another small step in a longer journey toward uniting our people, they are nonetheless one more stride on the path to Tantûrak." 
  gimilzir_events.712.a: "Maybe this dream may actually happen"

  gimilzir_events.713.t: "[azaridethholder.GetTitledFirstName] has Refused!"
  gimilzir_events.713.desc: "Disappointment swells within me, boiling into anger. How could [azaridethholder.GetTitledFirstName] deny me the [batanim|E] of [GetTitleByKey('c_azarideth').GetNameNoTier], condemning them to a lifetime as second-class citizens? Why does [azaridethholder.GetSheHe], who shows us no true respect, cling so tightly to these unwilling [faithful|E] subjects?\n\nI shake my head, but it does little to cool the fire within me. If he will not grant them to me, then I will take my people and leave as I choose.\n\nThe [batanim|E] will follow me, even against their [azaridethholder.GetLadyLord], if it means a future of freedom beyond these detestable [kingsmen|E]. Though smuggling so many out from under [azaridethholder.GetTitledFirstNamePossessive] grasp would be perilous, it may be my only chance to free my people from the clutches of the [balan_lai|E]."
  gimilzir_events.713.a: "The Batânim are mine, whether [azaridethholder.GetTitledFirstName] likes it or not!"
  gimilzir_events.713.b: "It isn't worth the risks"
  gimilzir_events.713.a.tt: "You will attempt to smuggle your people out of [GetTitleByKey('c_azarideth').GetNameNoTier]"

  gimilzir_events.714.t: "For a Better Future"
  gimilzir_events.714.desc: "I have decided to do the unthinkable, abduct an entire group of people, with their help, of course. The [batanim|E] of [GetTitleByKey('c_azarideth').GetNameNoTier] have long endured their place as lesser subjects, bound by obligations to serve a power that cares little for them. I intend to change that and free them, whether I must obey the law or not.\n\nThough they are nominally under [azaridethholder.GetTitledFirstName], if enough of us defy him together, what power would he truly have to stop us? The [batanim|E] are a rowdy, fiercely independent people, and convincing them to join such a bold plan should not be difficult.\n\nSoon, they will all be free of these unjust rulers."
  gimilzir_events.714.a: "Forward, for the good of all Batânim"
  gimilzir_events.714.b: "Maybe this isnt such a good idea after all..."

  gimilzir_events.714.a.success: "You will succeed in smuggling your people out of [GetTitleByKey('c_azarideth').GetNameNoTier]"
  gimilzir_events.714.a.failure: "You will fail to smuggle your people out of [GetTitleByKey('c_azarideth').GetNameNoTier]"

  gimilzir_events.715.t: "An Officer of Kharadûne"
  gimilzir_events.715.desc: "Of the many [batanim|E] who have joined me from [GetTitleByKey('c_azarideth').GetNameNoTier], a notable number were soldiers, and even some officers, of the local garrison tasked with defending the fortress. One such man, a relatively high-ranking commander, now bows before me.\n\n“Sir,” he began, lifting his head, “for many years I have served in the armies of Kharadûne, defending [thanihazad|E] from [anbalkumagan|E] and whatever else might threaten these lands.”\n\nHe exhaled, disappointment and bitterness tightening his expression. “Yet my talents have been ignored by these [kingsmen|E] lords, and I have grown weary of being passed over for my lesser peers. I ask you, please accept me into your service. Let me serve you, so that we [batanim|E] may never again suffer such disgrace.”"
  gimilzir_events.715.a: "Of course you may serve"
  gimilzir_events.715.b: "Maybe you should retire, and live a peaceful life"
  gimilzir_events.715.b.tt: "They leave, disappointed"

  gimilzir_events.716.t: "Never Suspected a Thing"
  gimilzir_events.716.desc: "Everything went perfectly. Contacts had been made, word spread throughout the [faithful|E] quarters, and a time and place set for the plan to begin.\n\nMy spies successfully disrupted the guard rotation, leaving a full hour in which the southern main gate stood unoccupied, wide open, and unguarded. This gave the [batanim|E] of [GetTitleByKey('c_azarideth').GetNameNoTier] more than enough time to depart, walking straight out through the front gate in open defiance of [azaridethholder.GetFirstName].\n\nBy the time [azaridethholder.GetTitledFirstName] learned of the sudden flight of his [batanim|E] subjects, we were already miles away, well beyond the reach of any reprisal."
  gimilzir_events.716.a: "The Faithful will have their home!"

  gimilzir_events.717.t: "Caught!"
  gimilzir_events.717.desc: "Everything was in place. Contacts had been made, word had spread throughout the [batanim|E] quarters, and a time and place set for the plan to begin. We were to disrupt the guard rotation and depart openly through the front gate, a public act of defiance against [azaridethholder.GetTitledFirstName] once his forces were in no position to respond. We never got the chance.\n\nOur spies, sent ahead to unsettle the guards and secure our passage, were uncovered in their deception.\n\nWith that, any hope of slipping the [faithful|E] beyond those high walls and battlements vanished, leaving them trapped within as serfs. We were forced to flee, and with it, any chance of having them at my side was lost."
  gimilzir_events.717.a: "How could this have happened..."

 BattlePoIHistoricalNameZairanak: "The Defence at Zâirânak"
 BattlePoIHistoricalDescZairanak: "#emp Victor: [GetScriptedCharacterByHistoryID( 'lineofgimilthani3' ).GetName]\nDefeated: [GetScriptedCharacterByHistoryID( 'linegimilzadan08' ).GetName] @death_icon!\nDate: [ageSA|E] 3418#!\n#weak The Defence of Zâirânak was a decisive engagement during the [balan_lai|E] invasion of [GetTitleByKey('k_pel').GetNameNoTier]. After the failed incursions led by [GetScriptedCharacterByHistoryID('linegimilzadan08').GetTitledFirstName], the [balan_lai|E] seized the initiative, advancing on the heavily fortified mountain pass of [GetTitleByKey('b_zairanak').GetNameNoTier]. As the armies of [GetScriptedCharacterByHistoryID('lineofgimilthani3').GetTitledFirstName] pressed into the narrow pass, [GetScriptedCharacterByHistoryID('linegimilzadan08').GetTitledFirstName] moved swiftly to respond, manning the defenses while leading a smaller force in repeated sorties to harass the advancing enemy. His strategy was to wear them down through constant pressure in anticipation of a prolonged siege.\n\nWhen battle was joined, these hit-and-run tactics proved effective, sapping the [balan_lai|E]’s morale and manpower. Yet the scale of the invasion soon became clear as the forces of [GetScriptedCharacterByHistoryID('lineofgimilthani3').GetTitledFirstName] far exceeded expectations, and fresh troops seemed to arrive without end. Before long, the [balan_lai|E] laid siege to the fortress at [GetTitleByKey('b_zairanak').GetNameNoTier]. Their formidable siege engines battered down its walls and reduced its towers to ruin in a matter of weeks.\n\nIn a final bid to turn the tide, [GetScriptedCharacterByHistoryID('linegimilzadan08').GetTitledFirstName] led his Royal Guard and the elite Argimilzagar-an-Êru in a decisive cavalry charge. The assault initially succeeded, shattering and routing much of the enemy’s left flank. However, [GetScriptedCharacterByHistoryID('lineofgimilthani3').GetTitledFirstName] quickly rallied his forces and counterattacked, leading the Knights of Kharadûnê in a devastating strike against [GetScriptedCharacterByHistoryID('linegimilzadan08').GetTitledFirstNamePossessive] rear. In the clash, the great commander was slain.\n\nWith [GetScriptedCharacterByHistoryID('linegimilzadan08').GetFirstNamePossessive] death, his son, [GetScriptedCharacterByHistoryID('linegimilzadan09').GetFirstName], attempted to regroup the army, but the effort collapsed. He was soon routed, later captured, and ultimately executed by [GetScriptedCharacterByHistoryID('lineofgimilthani3').GetTitledFirstName]. The battle ended in catastrophe, with much of [GetScriptedCharacterByHistoryID('linegimilzadan08').GetFirstNamePossessive] military strength being destroyed, along with both himself and his heir. Losses from which the realm would never truly recover.#!"

 #Úraumo - Unending Storm
 uraumo_name: "Úraumo"
 uraumo_description: "Úraumo, the Unending Storm, blade of [GetScriptedCharacterByHistoryID('lineofelros80').GetFirstName], was forged by the finest [numenorean|E] smiths of the [secondage|E]. This immense greatsword stands as tall as a man, and even a single blow is said to be capable of felling some of the mightiest beasts in all of [middleearth|E].\n\nCarried out of the [downfall|E] by [gimilziran|E], Úraumo quickly earned a fearsome reputation. Few could withstand its devastating power or the relentless ferocity of its swings, and it led its wielder to many victories against the [balan_lai|E] and other grave threats. \n\nOver time, it became the cherished heirloom of House Gimilzîr, passed down through the generations. It remains with the family to this very day."

