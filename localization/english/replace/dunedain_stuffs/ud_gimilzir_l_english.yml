 lotr_gimilzir_tanturak_contract_inzilloni: "Petition Inzillôni"
 lotr_gimilzir_tanturak_contract_inzilloni_contract: "$lotr_gimilzir_tanturak_contract_inzilloni$"
 lotr_gimilzir_tanturak_contract_inzilloni_desc: "\nAmid the wide wheat fields of [GetTitleByKey('k_kharadune').GetNameNoTier] stands Inzillôni. This [numenorean|E] city is home to a large number of [faithful|E] [adunai|E], and its rulers have been among the more accepting of our people, often recruiting many of the Knights of Kharadûne from our ranks.\n\nIf I am to settle new lands, I must bring these people with me. To do so, I must petition the local lord, seeking leave to gather all [batanim|E] and lead them forth at my side."
 lotr_gimilzir_tanturak_contract_inzilloni_desc_title: "$lotr_gimilzir_tanturak_contract_inzilloni$"
 lotr_gimilzir_tanturak_contract_inzilloni_request: "This [task_contract|E] requires you to pay a visit to a ruler."
 
 lotr_gimilzir_tanturak_contract_azarideth: "Petition Azarîdêth"
 lotr_gimilzir_tanturak_contract_azarideth_contract: "$lotr_gimilzir_tanturak_contract_azarideth$"
 lotr_gimilzir_tanturak_contract_azarideth_desc: "\nThe fortress of Azarîdêth is a truly formidable sight, and within its walls reside many [batanim|E], often set to serve as soldiers and laborers to man the mighty citadel.\n\nIf I am to settle Tantûrak, I must bring these [faithful|E] with me. To do so, I must petition the local lord, seeking permission to gather the [batanim|E] and lead them forth at my side." 
 lotr_gimilzir_tanturak_contract_azarideth_desc_title: "$lotr_gimilzir_tanturak_contract_azarideth$"
 lotr_gimilzir_tanturak_contract_azarideth_request: "This [task_contract|E] requires you to pay a visit to a ruler."
 
 lotr_gimilzir_tanturak_contract_uruloni: "Petition Ûrulôni"
 lotr_gimilzir_tanturak_contract_uruloni_contract: "$lotr_gimilzir_tanturak_contract_uruloni$"
 lotr_gimilzir_tanturak_contract_uruloni_desc: "\nÛrulôni is the seat of power for the mighty [GetScriptedCharacterByHistoryID('lineofgimilthani3').GetDynasty.GetBaseName] [dynasty|E], the very same [dynasty|E] that shattered my ancestors’ dream of a united [faithful|E] [thanihazad|E]. Though that history still weighs heavily upon me, many [batanim|E] settled in Ûrulôni after our exile from [GetTitleByKey('k_pel').GetNameNoTier].\n\nI will travel to Ûrulôni to gather the [batanim|E], seeking to lead them forth at my side." 
 lotr_gimilzir_tanturak_contract_uruloni_desc_title: "$lotr_gimilzir_tanturak_contract_uruloni$"
 lotr_gimilzir_tanturak_contract_uruloni_request: "This [task_contract|E] requires you to pay a visit to a ruler."
 
 lotr_gimilzir_tanturak_contract_mispir: "A Summons to Mispír"
 lotr_gimilzir_tanturak_contract_mispir_contract: "$lotr_gimilzir_tanturak_contract_mispir$"
 lotr_gimilzir_tanturak_contract_mispir_desc: "\nAn unexpected stranger appeared in my camp, offering an 'opportunity' to me and my fellows. I am to travel to Mispír and meet with the city’s ruler to discuss the fate of its [batanim|E] population. I had not anticipated such a summons, but if I am to unite my people, it is an opportunity I cannot afford to ignore."
 lotr_gimilzir_tanturak_contract_mispir_desc_title: "$lotr_gimilzir_tanturak_contract_mispir$"
 lotr_gimilzir_tanturak_contract_mispir_request: "This [task_contract|E] requires you to travel to a ruler's court."
 
 lotr_gimilzir_tanturak_contract_gimileth: "Letter from Gimilêth?"
 lotr_gimilzir_tanturak_contract_gimileth_contract: "$lotr_gimilzir_tanturak_contract_gimileth$"
 lotr_gimilzir_tanturak_contract_gimileth_desc: "\nI have received a truly unexpected letter from Gimilêth, urging me to petition the local lord to allow members of the Sapthân-lâi population to join me. The letter claims they believe I will build a realm more accepting of their faith than then the [balan_lai|E].\n\nWhile not part of my original plans, and with Gimilêth holding few [batanim|E], the Sapthân-lâi could still strengthen my following and help build a my realm in Tantûrak." 
 lotr_gimilzir_tanturak_contract_gimileth_desc_title: "$lotr_gimilzir_tanturak_contract_gimileth$"
 lotr_gimilzir_tanturak_contract_gimileth_request: "This [task_contract|E] requires you to travel to a ruler's court."
  
 lotr_gimilzir_tanturak_contract_arpel: "Petition Lôni Hîsekhôr"
 lotr_gimilzir_tanturak_contract_arpel_contract: "$lotr_gimilzir_tanturak_contract_arpel$"
 lotr_gimilzir_tanturak_contract_arpel_desc: "\nLôni Hîsekhôr was once the city from which [gimilziran|E] ruled, and for many [batanim|E] it remains a place of pilgrimage. As such, it still holds a considerable [faithful|E] presence.\n\nThough many may grieve to depart from the city of [gimilziran|E], I cannot leave them behind. I will travel to Lôni Hîsekhôr and seek the lord’s permission to gather the [batanim|E] and lead them forth at my side." 
 lotr_gimilzir_tanturak_contract_arpel_desc_title: "$lotr_gimilzir_tanturak_contract_arpel$"
 lotr_gimilzir_tanturak_contract_arpel_request: "This [task_contract|E] requires you to pay a visit to a ruler."

 lotr_gimilzir_tanturak_contract_arpel_sailing: "Acquire a Fleet"
 lotr_gimilzir_tanturak_contract_arpel_sailing_contract: "$lotr_gimilzir_tanturak_contract_arpel_sailing$"
 lotr_gimilzir_tanturak_contract_arpel_sailing_desc: "\nNow that the many [batanim|E] have been united under my followership, I must now acquire a great many ships in order to sail them and their belongings to our new homeland in [GetTitleByKey('k_tanturak').GetNameNoTier]"
 lotr_gimilzir_tanturak_contract_arpel_sailing_desc_title: "$lotr_gimilzir_tanturak_contract_arpel_sailing$"
 lotr_gimilzir_tanturak_contract_arpel_sailing_request: "This [task_contract|E] requires you to pay a visit to a ruler."
 

