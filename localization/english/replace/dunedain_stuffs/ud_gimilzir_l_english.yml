 ##Gimilzir Decisions
 decision_group_type_gimilzir_decisions: "Gimilzîr Decisions"

 decision_choose_gimilzir_path: "The Future of House Gimilzîr"
 decision_choose_gimilzir_path_desc: "The future of my House rests in my hands, and the weight of it is not lightly borne. There is much to consider, and each path before me demands careful thought, for none are without risk, and all will shape our fate in ways that cannot be undone.\n\nOnce, my family held dominion over the lands of the [GetTitleByKey('k_pel').GetName], where [gimilziran|E] came ashore and founded his great, if short-lived, kingdom. To reclaim those lands would be to restore what was lost, to root our legacy once more in the soil where it first took hold.\n\nYet another road calls me northward, toward war and reckoning. There, I could take up the struggle begun by my forebear, [GetScriptedCharacterByHistoryID('linegimilzadan01').GetTitledFirstName], and carry the fight to [anbalkumagan|E]. Victory there would not only avenge old wounds, but carve out new lands for me to rule.\n\nOr I may turn away from both, and look instead to the distant east. Beyond the bounds of [thanihazad|E] lie the long-lost lands of Tantûrak, vast and abandoned.  There, I could lead what remains of the [faithful|E] left in [thanihazad|E] to a new beginning, far from the shadows that haunt us here.\n\nEach choice bears its own promise, and its own cost. Whatever path I choose, it will define the destiny of my House for generations to come."
 decision_choose_gimilzir_path_tooltip: "We must choose the future of House Gimilzîr"
 decision_choose_gimilzir_path_confirm: "The future of House Gimilzîr is bright!"
 decision_choose_gimilzir_path_tt: "I will choose the future of House Gimilzîr"

 decision_continue_adventure_gimilzir_tanturak: "Continue Your Adventure"
 decision_continue_adventure_gimilzir_tanturak_tooltip: "#italic If your current story [task_contract|E] has vanished, you may regain it here."
 decision_continue_adventure_gimilzir_tanturak_desc: "My companions and I still have work to do. We shall not rest until Tantûrak is mine.\n\n#N Only take this decision  if you've lost your current story contract#!!"
 decision_continue_adventure_gimilzir_tanturak_confirm: "Adventure calls."
 decision_continue_adventure_gimilzir_tanturak_tt: "Your current story [task_contract|E] is regained"

 ##Gimilzir Events

 gimilzir_events.2.t: "The Rise of House Gimilzîr"
 gimilzir_events.2.desc: "House Gimilzîr has always been a small, insular, but close-knit family. Taking care of their own, not interacting much with those outside their estate in [GetTitleByKey('c_mispir').GetNameNoTier]. Able to trace their bloodline back to [elrosshort|E] himself, they retain some of the purest [bloodofnumenor|E] in all of [thanihazad|E] which has afforded them some amount of renown. After [gimilziran|E]'s failed conquests in the early [thirdage|E], this is how the family lingered. Rotting as their ancient estate built after their exile from [GetTitleByKey('k_pel').GetNameNoTier], gathered dust and slowly crumbled away.\n\nHowever, [GetScriptedCharacterByHistoryID( 'linegimilzadan01' ).GetFirstNameNicknamed] Gimilzîr, changed the tune of the family forever. The [stormhost|E] invaded [thanihazad|E] early in the man's life, and returning the call of the [balan_lai|E] [GetScriptedCharacterByHistoryID( 'linegimilzadan01' ).GetFirstNameNicknamed] came to their aid as a Knight of Kharadûne. During a seige on [GetTitleByKey('c_mispir').GetNameNoTier], the ancient Estate of Gimilzîr, was raised and reduced to rubble by the [stormhost|E] army. Since that day the Gimilzîr family has been without a proper estate, following the head of their House wherever they may go. [GetScriptedCharacterByHistoryID( 'linegimilzadan01' ).GetFirstNameNicknamed] fought valiantly and served for most of his life, becoming the personal champion of [GetScriptedCharacterByHistoryID( 'lineofgimilthani47' ).GetFirstNameNicknamed]. He won the Gimilzîr family much honor with his many great deeds in those days, of which he is remembered quite fondly by all who knew him. \n\nMuch like his grandfather before him, [GetScriptedCharacterByHistoryID( 'linegimilzadan1' ).GetFirstNameNicknamed] also joined the Knights at the young age of 24. There he rose through the ranks at lightning speed. He quickly made a name for himself as one of the greatest knights in the history of [thanihazad|E], with some even saying he rivaled his Grandfather. However, after a particularly bad wound, and the news of his newborn son, [GetScriptedCharacterByHistoryID( 'linegimilzadan1' ).GetFirstNameNicknamed] left the knights to see after his family. Now, at the young age of 19 [GetScriptedCharacterByHistoryID( 'linegimilzadan2' ).GetFirstNameNicknamed] was gifted by his father the honor of becoming head of House Gimilzîr.\n\nThe young man was not ready for such a great responsibility, fearing he would let down his family and fail to rise to the great heights of his Father and Great-Grandfather. He did not even dare think of even approaching the brilliance of [gimilziran|E]. [GetScriptedCharacterByHistoryID( 'linegimilzadan1' ).GetFirstNameNicknamed] nonetheless believes in his son and sees him as a true heir of [numenor|E], with the wits and grace to forge a destiny greater than any other in House Gimilzîr, and to possibly, even fulfill the lamented dream of [gimilziran|E]."
  gimilzir_events.2.a: "We all have hope in the young [GetScriptedCharacterByHistoryID( 'linegimilzadan2' ).GetFirstNameNicknamed]!"

  gimilzir_events.3.t: "Am I worthy?"
  gimilzir_events.3.desc: "Anxiety grips my heart with each passing dawn, as another day of leading my family stretches before me like an unending road. This burden was never one I sought, nor one I believed myself capable of bearing. I am no leader, no soldier, no warrior, no great statesman or silver-tongued diplomat. I am just... Ârûgimil. An unworthy heir to far greater sires, a shadow cast by the weight of their legacy.\n\nAnd yet, here I stand as head of my House. All who bear my name now look to me, their hopes and fears resting upon my shoulders. All trusting that I will guide them out of our withering darkness. I feel that weight in every word I speak, every choice I make. It presses upon me in quiet moments, whispering of my doubts, of my failings, of how easily I might falter.\n\nStill, I am not alone. My parents stand beside me, offering counsel, strength, and patience far beyond what I deserve. And [GetScriptedCharacterByHistoryID( 'linegimilethtwocustom2' ).GetFirstName], my steadfast friend, listens when the silence grows too heavy, when my thoughts turn against me. Without them, I fear I would have crumbled already beneath the strain of it all.\n\nI am an heir to [elros|E] himself. That truth both humbles and terrifies me. Such a lineage is no small thing, it is a flame that must be carried, not allowed to gutter and fade. I do not yet know if I possess the strength to live up to it... but I must try. I must prove it to them, to my family, to those who believe in me.\n\nMost of all, I must prove it to myself."
  gimilzir_events.3.a: "They place their hope in me, but I have none in myself."
  enable_gimilzir_decision: "Once you attain [prestige_level|E] @prestige_level_3_icon![GetModifier('prestige_level_3').GetNameWithTooltip|L], you will be able to choose House Gimilzîr's path forward"

  gimilzir_events.4.t: "The Path Forward for House Gimilzîr"
  gimilzir_events.4.desc1: "After much time, effort, and more than a fair share of anxiety, I have done what once seemed impossible. I have proven myself wrong, and my family right. In my stewardship, I have brought glory and renown to our name, and wealth and plenty to my house. Not since the early [thirdage|E] has House Gimilzîr known such prosperity or such standing among the realms. \n\nThough it is difficult for me to believe, much of our glory has come through my own command, and even I cannot deny what has been achieved. Where once there was doubt, there is now recognition. Where once there was uncertainty, there is now influence. And yet, prosperity has not quieted ambition. On the contrary, it has stirred it. Within House Gimilzîr, voices now speak not of survival, but of destiny, of what we might yet become.\n\nSome look back to what was lost, and demand its restoration. They urge us to reclaim [GetTitleByKey('k_pel').GetNameNoTier], and perhaps even all of [GetTitleByKey('e_thani_hazad').GetNameNoTier]. To finally realize the long-faded dream of [gimilziran|E] and restore what our line once reached for, but never fully held.\n\nOthers still hardened by the memory and loss of our old estate in [GetTitleByKey('c_mispir').GetNameNoTier] demand vengeance. They speak of [anbalkumagan|E], and of settling the score by taking their lands and breaking their power once and for all. Finally saving the [sevenlands|E] from their evil and depravity."
  gimilzir_events.4.desc2: "After much time and effort, I have done what once seemed impossible. In my stewardship, I have brought glory and renown to our name, and wealth and plenty to my house. Not since the early [thirdage|E] has House Gimilzîr known such prosperity or such standing among the realms. \n\nWhere once there was doubt, there is now recognition. Where once there was uncertainty, there is now influence. And yet, prosperity has not quieted ambition. On the contrary, it has stirred it. Within House Gimilzîr, voices now speak not of survival, but of destiny, of what we might yet become.\n\nSome look back to what was lost, and demand its restoration. They urge us to reclaim [GetTitleByKey('k_pel').GetNameNoTier], and perhaps even all of [GetTitleByKey('e_thani_hazad').GetNameNoTier]. To finally realize the long-faded dream of [gimilziran|E] and restore what our line once reached for, but never fully held.\n\nOthers still hardened by the memory and loss of our old estate in [GetTitleByKey('c_mispir').GetNameNoTier] demand vengeance. They speak of [anbalkumagan|E], and of settling the score by taking their lands and breaking their power once and for all. Finally saving the [sevenlands|E] from their evil and depravity."
  gimilzir_events.4.desc3: "\n\nAnd then there are those more cautious, those who see danger in both pride and revenge. They counsel departure instead, that we leave [thanihazad|E] behind entirely, gather what remains of the [faithful|E], and seek fortune elsewhere. A new beginning, far from the shadow of past failures and the enemies that still linger here in [thanihazad|E].\n\nAll of them now turn to me. The weight of choice rests where it always has, upon my shoulders. And whatever path I choose, it will not merely shape the present. It will define what House Gimilzîr becomes for generations."
  gimilzir_events.4.desc4: "\n\nAll of them now turn to me. The weight of choice rests where it always has, upon my shoulders. And whatever path I choose, it will not merely shape the present. It will define what House Gimilzîr becomes for generations."
  gimilzir_events.4.a: "Pél was [GetScriptedCharacterByHistoryID('linegimilzadan08').GetTitledFirstNamePossessive] and so it shall me mine"
  choose_gimilzir_path_tt_1: "You will gather allies and strength to support your conquest of [GetTitleByKey('k_pel').GetNameNoTier]"
  gimilzir_events.4.b: "An-Balkûmagân is an enemy of all that is good"
  choose_gimilzir_path_tt_2: "You will gather allies and strength to support your conquest of [anbalkumagan|E]."
  gimilzir_events.4.c: "I shall find a new homeland for my people"
  choose_gimilzir_path_tt_3: "You will gather all the remaining [faithful|E] in [thanihazad|E] and set sail for a new homeland"
  gimilzir_events.4.d: "I quite like the adventurer life..."
  choose_gimilzir_path_tt_4: "You will forge your own path forward, without any guidance"
  gimilzir_events.4.e: "I need more time to think"
  choose_gimilzir_path_tt_5: "You will choose at a different time"

  gimilzir_events.7.t: "Towards a New Home"
  gimilzir_events.7.desc: "Ever since the defeats of [gimilziran|E] and the loss of [GetTitleByKey('k_pel').GetNameNoTier] to the [tamska|E], the [faithful|E] of [thanihazad|E] have had no homeland to call their own. They now live scattered among the Kharadûnâi, often regarded as lesser than their [kingsmen|e] neighbors, and at times subjected to outright persecution. Those few [faithful|E] who remain today, though steadfast in their beliefs, endure life as religious outcasts within Kharadûnâi society, or else conceal their faith for fear of reprisal.\n\nThough this has brought great suffering upon my people, it has also led many within [thanihazad|E] to see them as burdens best cast aside. With careful persuasion, they may be convinced to allow me to gather the [faithful|E] and lead them away, to a new homeland. One we may call our own, far from the oppression we have long endured."
  gimilzir_events.7.a: "But where could our new homeland truly be?"

  gimilzir_events.71.t: "Tantûrak?"
  gimilzir_events.71.desc: "While it may at first seem unconventional, even ironic, given the dark and truly evil legacy of that forsaken realm of [black_numenoreans|E], Tantûrak may yet prove an ideal site for a new homeland. Much of south-eastern [middleearth|E] is already thickly settled, its broad lands claimed by many peoples, yet the regions about the Bay of Ûsakan remain largely empty. The few [men|E] who dwell there, scattered in decentralized tribal societies, could be readily brought into loyal service.\n\nMore promising still is the presence of the [kinnlai|E], elves with whom we might forge enduring alliances and true friendship.\n\nThough the journey would be long, arduous, and fraught with uncertainty, this path offers the Batânim a future in which they may finally possess a land of their own. A realm not of ceaseless war, but of peace and prosperity. It may lack the glory of the other roads before us, yet I cannot help but see it as the wisest of them all."
  gimilzir_events.71.a: "The lost realm of Tantûrak shall be the home of my people"
  gimilzir_events.71.b: "No, this isn't the path forward!"
  gimilzir.71.tt_1: "You will petition the many lords of the [balan_lai|E], seeking leave to lead your people out of [thanihazad|E]"
  gimilzir.71.tt_2: "A #high Story Contract#! becomes available"
  gimilzir.71.tt_3: "You will choose a different path"

 BattlePoIHistoricalNameZairanak: "The Defence at Zâirânak"
 BattlePoIHistoricalDescZairanak: "#emp Victor: [GetScriptedCharacterByHistoryID( 'lineofgimilthani3' ).GetName]\nDefeated: [GetScriptedCharacterByHistoryID( 'linegimilzadan08' ).GetName] @death_icon!\nDate: [ageSA|E] 3418#!\n#weak The Defence of Zâirânak was a decisive engagement during the [balan_lai|E] invasion of [GetTitleByKey('k_pel').GetNameNoTier]. After the failed incursions led by [GetScriptedCharacterByHistoryID('linegimilzadan08').GetTitledFirstName], the [balan_lai|E] seized the initiative, advancing on the heavily fortified mountain pass of [GetTitleByKey('b_zairanak').GetNameNoTier]. As the armies of [GetScriptedCharacterByHistoryID('lineofgimilthani3').GetTitledFirstName] pressed into the narrow pass, [GetScriptedCharacterByHistoryID('linegimilzadan08').GetTitledFirstName] moved swiftly to respond, manning the defenses while leading a smaller force in repeated sorties to harass the advancing enemy. His strategy was to wear them down through constant pressure in anticipation of a prolonged siege.\n\nWhen battle was joined, these hit-and-run tactics proved effective, sapping the [balan_lai|E]’s morale and manpower. Yet the scale of the invasion soon became clear as the forces of [GetScriptedCharacterByHistoryID('lineofgimilthani3').GetTitledFirstName] far exceeded expectations, and fresh troops seemed to arrive without end. Before long, the [balan_lai|E] laid siege to the fortress at [GetTitleByKey('b_zairanak').GetNameNoTier]. Their formidable siege engines battered down its walls and reduced its towers to ruin in a matter of weeks.\n\nIn a final bid to turn the tide, [GetScriptedCharacterByHistoryID('linegimilzadan08').GetTitledFirstName] led his Royal Guard and the elite Argimilzagar-an-Êru in a decisive cavalry charge. The assault initially succeeded, shattering and routing much of the enemy’s left flank. However, [GetScriptedCharacterByHistoryID('lineofgimilthani3').GetTitledFirstName] quickly rallied his forces and counterattacked, leading the Knights of Kharadûnê in a devastating strike against [GetScriptedCharacterByHistoryID('linegimilzadan08').GetTitledFirstNamePossessive] rear. In the clash, the great commander was slain.\n\nWith [GetScriptedCharacterByHistoryID('linegimilzadan08').GetFirstNamePossessive] death, his son, [GetScriptedCharacterByHistoryID('linegimilzadan09').GetFirstName], attempted to regroup the army, but the effort collapsed. He was soon routed, later captured, and ultimately executed by [GetScriptedCharacterByHistoryID('lineofgimilthani3').GetTitledFirstName]. The battle ended in catastrophe, with much of [GetScriptedCharacterByHistoryID('linegimilzadan08').GetFirstNamePossessive] military strength being destroyed, along with both himself and his heir. Losses from which the realm would never truly recover.#!"

 #Úraumo - Unending Storm
 uraumo_name: "Úraumo"
 uraumo_description: "Úraumo, the Unending Storm, blade of [GetScriptedCharacterByHistoryID('lineofelros80').GetFirstName], was forged by the finest [numenorean|E] smiths of the [secondage|E]. This immense greatsword stands as tall as a man, and even a single blow is said to be capable of felling some of the mightiest beasts in all of [middleearth|E].\n\nCarried out of the [downfall|E] by [gimilziran|E], Úraumo quickly earned a fearsome reputation. Few could withstand its devastating power or the relentless ferocity of its swings, and it led its wielder to many victories against the [balan_lai|E] and other grave threats. \n\nOver time, it became the cherished heirloom of House Gimilzîr, passed down through the generations. It remains with the family to this very day."

