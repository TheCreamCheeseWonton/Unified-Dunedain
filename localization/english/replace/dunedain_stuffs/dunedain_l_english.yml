 #Integration
 decision_integrate_pharazain_province: "Integrate Provinces"
 decision_integrate_pharazain_province_desc: "The outbreak of the [GetTitleByKey('e_pharazain').GetNameNoTier] Civil War struck the administration of the Golden Dominion with devastating force. Centralized control nearly collapsed, leaving the Gilden Sovereign with only a tenuous hold over the provinces of their own realm. Levies and taxes from all but the most central regions vanished almost overnight.\n\nWith the administrative apparatus in ruins, we must rebuild it from the ground up, a structure strong enough to endure and prevent such chaos from ever occurring again.\n\nOur first task is to reintegrate each [kingdom|E] [title|E] into the administration, reconnecting them to the greater realm and restoring the Golden Dominion’s authority throughout the land."
