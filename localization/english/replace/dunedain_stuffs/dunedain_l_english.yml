l_english:
 ##Buildings
 #building_wonder_cirith_ungol_02:0 "Cirith Ungol - Reclaimed"
 #building_wonder_cirith_ungol_02_desc:0 "Long ago Cirith Ungol was built to keep the watch on [mordor|E] and protect [gondor|E] after the [warlastalliance|E]. After countless years under the dictatorship of the [witchkingshort|E] of [angmar|E], this once proud [gondorian|E] fortress has been reclaimed. Evermore shall the watchful gaze of Cirith Ungol be used to protect [gondor|E]'s heartland from the darkness of [mordor|E]."

 #building_wonder_Calenmîr_03:0 "Calenmîr - Rebuilt"
 #building_wonder_aldburg_03_desc:0 "Calenmîr, or the Green Jewel, has been reclaimed by the [dunedain|E]. Whether through diplomacy or the sword, [calenardhon|E] has been reborn as a province within the [realms_in_exile|E]. Rebuilt in the image of Calenmîr of old, the city has once again become one of the wealthiest cities in all of [calenardhon|E], with a distinct [gondorian|E] character."

 #building_wonder_mispir_2:0 "Capital of Mispir"
 #building_wonder_mispir_2_desc:0 "The city of Mispir, since the unification of the [thanihazad|E], has grown prosperous. Expanded considerably, and with an extensive increase in population, the city is unrivaled in all of southern [middleearth|E] and rivals some of the greatest cities in the world. Her ports are full, markets bustling, and homes filled with prosperity and wealth. The long history of Mispir as the seat of the [balan_lai|E] and the center of [adunaic|E] rule persists in the city, inspiring politics and vice even to this day. Mispir continues to be the center of [thanihazad|E] in heart, soul, and state. "

 building_type_wonder_anonarmenlos_01: "Armenelostion"
 building_type_wonder_anonarmenlos_01_desc: "Armenelostion, or 'Son of [armenelos|E]', is one of the greatest cities made by [man|E], even rivaling the cities of [numenor|E] in their splendor. From her white walls and great ports, the legacy of [numenor|E] flows. Made in the shape and memory of [armenelos|E], no other city today has as strong a claim as Armenelostion of being a truly [numenorean|E] city."
 building_wonder_anonarmenlos_01: "Armenelostion"
 building_wonder_anonarmenlos_01_desc: "Armenelostion, or 'Son of [armenelos|E]', is one of the greatest cities made by [man|E], even rivaling the cities of [numenor|E] in their splendor. From her white walls and great ports, the legacy of [numenor|E] flows. Made in the shape and memory of [armenelos|E], no other city today has as strong a claim as Armenelostion of being a truly [numenorean|E] city."
 building_wonder_anonarmenlos_02: "Yantalondë"
 building_wonder_anonarmenlos_02_desc: "The Yantalondë, or 'Bridge Havens' are the many havens of Armenelostion. The archipelago is a collection of many comparatively small islands, and between them all are the Great Bridges of Armenelostion. So great and colossal are their breadth that many host entire towns and districts of the city themselves! And along every Great Bridge is a Great Haven, where goods from all over the world come and go as the center of trade in all of [middleearth|E]. The Yantalondë exemplifies the maritime character of the city and the immense effort required in their construction."
 building_wonder_anonarmenlos_03: "Númen Mindon"
 building_wonder_anonarmenlos_03_desc: "The Númen Mindon, or 'Western Great Tower' is on the archipelago's tallest point on the westernmost island. This soaring tower reaches into the very heavens and peers outwards towards the western seas, towards [meneltarma|E]. Here is taught the history of [numenor|E], of the corruption and wicked hate that infected the hearts of the [numenoreans|E], and of their eventual fait in the [akallabeth|E]. A somber place of lore, remembrance, and teaching, the wardens of Númen Mindon dedicate themselves to duty, ensuring that the painful events at the end of the [secondage|E] never again come to pass."

 ##Blockers
 building_type_ruins_of_arnor: "Arnorian Ruins"
 building_type_ruins_of_arnor_desc: "$building_ruins_of_arnor_desc$"
 building_ruins_of_arnor: "Arnorian Ruins"
 building_ruins_of_arnor_desc: "Ancient walls, crumbling towers, and dilapidated homes litter these wild and empty lands. Remnants of a bygone age of prosperity, these ruins are all that endures of the once mighty Kingdom of [arnor|E]."
 building_ruins_of_arnor_cleared: "Restored Homesteads"
 building_ruins_of_arnor_cleared_desc: "The ruins of these lands have been given new life. Once ruined structures have been repurposed for a variety of uses, from humble farmsteads to modest markets, serving the needs of the colonists.\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"


 building_type_ruins_of_arnor_bad: "Dense Arnorian Ruins"
 building_type_ruins_of_arnor_bad_desc: "$building_ruins_of_arnor_bad_desc$"
 building_ruins_of_arnor_bad: "Dense Arnorian Ruins"
 building_ruins_of_arnor_bad_desc: "Street after street, house after house, abandoned and crumbling. Once teeming with countless souls, this land now lies silent and dead in the shadow of #E [arnor|E]’s #!fall."
 building_ruins_of_arnor_bad_cleared: "Quarter Rebuilt"
 building_ruins_of_arnor_bad_cleared_desc: "While attempting to fully restore the vast sea of ruins in these lands would be a fool’s errand, select quarters of particular value have been rebuilt to a habitable state, ready for colonists to move in and continue the reclamation of [arnor|E].\n\n#V Clearing [colonisation_blockers|E] allows your settlement to upgrade.#!"

 building_type_wonder_calemmanc_00: "Calemmanc"
 building_type_wonder_calemmanc_00_desc: "Calemmanc, [gondorian|E] provincial capital of Calenmîr, is the “Green Jewel” of [gondor|E]. It rises on the edge of [calenardhon|E]’s plains where the Mitheithel winds through oaks and wild meadows. Built of pale limestone, its walls turn emerald after rain as moss and lichen take hold. Four corner towers, each named for an ancient Gondorian house, stand watch over the surrounding fields, their shadows stretching across the pale courtyard when dusk falls."
 building_wonder_calemmanc_00: "Old Town of Aldburg"
 building_wonder_calemmanc_00_desc: "Among the oldest castles of [rohan|E], Aldburg is built with stone, incorporating the structures and fortifications of the old [gondorian|E] provincial capital of Calenmîr. The fortress crowns a grassy knoll with stout earth-and-stone ramparts and a single iron‑bound gatehouse flanked by round towers. Within its walls lie timber‑framed barracks, granaries, stables, and a central keep reached by a spiral stair, all arranged for rapid mustering of riders. Though weathered and moss‑clad, its battlements still command sweeping views of the Folde and the Onodló approaches.\n\nAldburg is now destined to be rebuilt in the image of old Calemmanc, though that day has not yet come."
 building_wonder_calemmanc_02: "Calemmanc, Seat of the Horse Lords"
 building_wonder_calemmanc_02_desc: "Calemmanc has come into its own, and now stands as a proud city of the [dunedain|E]. Yet the memory of the [rohirrim|E] is neither scorned nor forgotten. The oaths of Eorl the Young are etched in granite, carved into the very throne upon which the lords of [calenardhon|E] now sit. Proud guards of both [gondor|E] and the [rohirrim|E] keep watch over the stout iron gates and stone towers of this bustling metropolis.\n\nThe city itself has grown more than twofold since the days of [rohan|E], driven by a great influx of [gondorians|E] following our acquisition of [calenardhon|E]. This surge of settlers has transformed Calemmanc, raising it to heights unseen in the histories of either [rohan|E] or [calenardhon|E], far surpassing the Calemmanc of old."

 not_morgul_corrupted: "[GetTitleByKey('c_minas_ithil').GetNameNoTier] no longer has the [GetStaticModifier('fading_morgul_corruption_modifier').GetNameWithTooltip] [county|E] [modifier|E]"
  ##Religions
 faith_adunaic_faithful: "Batân an-Êru"
 faith_adunaic_faithful_adj: "Batân an-Êru"
 faith_adunaic_faithful_adherent: "Batâni"
 faith_adunaic_faithful_adherent_plural: "Batânim"
 faith_adunaic_faithful_desc: "[Glossary('Anâm nakhô Bârazra sakalada — phazagada, magada, azarada — katha gimilî nâluthôr.', 'gimils_pledge_gloss' )]\n\nThus spoke [gimilziran|E], upon his landing in [middleearth|E] after the [akallabeth|E], and so was the High Kingdom of [thanihazad|E] borne from his ships and the colonies of the [sevenlands|E]. \n\nOr at least, this was the ambition of [gimilziran|E].\n\nBatân an-Êru (The Path of Êru) is a faith of the [faithful|E], a continuation of ancient [numenorean|E] tradition and the teachings once bestowed by the [highelves|E]. Established in the wake of the short-lived conquests of the [faithful|E] [gimilziran|E], it was conceived as a means to preserve stability within his realm by syncretizing his [faithful|E] beliefs with the beliefs of the local [kingsmen|E] population. Unlike their northern [faithful|E] brethren, the Batân an-Êru incorporates some aspects of [kingsmen|E] philosophy into their doctrine, most notably the idea of the [adunaic|E] divine mandate to rule, while remaining rooted in the central truths of [faithful|E] ideals. The Batân an-Êru continues on the legacy of the [numenoreans|E] original intent, coming as teachers and friends to the Men of [middleearth|E].\n\nToday, the followers of Batân an-Êru are scattered and few. In the wake of [gimilziran|E]'s failed grasp for empire, only his heirs and a small, underground circle remain. Yet those who still walk the Path do so with iron resolve. Their faith is fierce, unyielding where others bend, and they would gladly take up arms to preserve the legacy of the Southern [faithful|E] of [thanihazad|E]."

 tenet_unrelenting_faith_adunai_faithful_name: "Light Unyielding"
 tenet_unrelenting_faith_adunai_faithful_desc: "Surrounded by those who have turned from the light of [eru|E], we stand alone in a sea of shadow. Yet we do not waver. No trial will bend us, no darkness unmake us. We will stand, and we will fight any who would tear our faith from us."

 ##Cultures
 new_dunedain: "Erthad Dúnedain"
 new_dunedain_collective_noun: "Erthad Dúnedain"
 new_dunedain_prefix: "Erthad Dúnedain"
 new_dunedain_ethnicity: "Erthad Dúnedain"
 new_dunedain_desc: "#size:15    [dunedain|E] is a term used to refer to those descended from the [faithful|E] [numenoreans|E] in [middleearth|E]. They primarily populated the realms of [arnor|E] and [gondor|E], and because of this, many of the great events of the [thirdage|E] revolved around this proud people. Their strength and number have dwindled with the destruction of [arnor|E] and the constant assaults on [gondor|E], but the heirs of [numenor|E] retain much of the wisdom and nobility of their ancient forefathers. Now united, the future is within Erthad [dunedain|E] hands.#"

 heritage_unified_adunaic_name: "Adûnâic"
 heritage_unified_adunaic_collective_noun: "Adûnâic"

 pharazaini_culture: "Pharazâini"
 pharazaini_culture_collective_noun: "Pharazâini"
 pharazaini_culture_prefix: "Pharazâinic"
 pharazaini_culture_ethnicity: "Pharazâinic"
 pharazaini_culture_desc: "#size:15    The Pharazâini, or 'People of the Golden Lands', refer to the [culture|E] that has developed in the Lands of [bellakar|E], [anbalkumagan|E], and [thanihazad|E] since the unification of the former southern [numenorean|E] colonies. While the lands of the Pharazâini are more distant and disunified than those of their northern [dunedain|E] cousins, the [adunaic|E] peoples of the south hold onto their ancient [numenorean|E] heritage with a much firmer grasp, and won't allow their sacred traditions to fall out of favor. Interestingly, the unification of the disparate [adunaic|E] realms of the south has led the Pharazâini to become less depraved than many of their forefathers.\n\nThe Pharazâini believe that their noble heritage gives them a right to rule over lesser peoples, but this should be done with some echo of the original [numenorean|E] mission to educate and aid the benighted natives.#"

 language_pharazunaic_name: "Pharazûnâic"
 language_pharazunaic_desc: "Golden [adunaic|E] is the dialect of [adunaic|E] spoken in Pharazâin, the “Golden Lands,” encompassing the former realms of [bellakar|E] and [thanihazad|E]. It is a highly conservative branch of [adunaic|E], deriving much of its form from Kharadûnaic, the most traditional variant of the tongue. When this dialect first took shape, a fusion of Kharadûnaic and Belladûnaic, it was discovered that many [haradrim|E]-influenced words in Belladûnaic had no true equivalents in any [adunaic|E] language. To preserve the purity of their speech and reject all non-[adunaic|E] influences, new [adunaic|E] words were created to replace these foreign terms."

 new_numenorean: "Cîr Númenórean"
 new_numenorean_ethnicity: "Cîr Númenórean"
 new_numenorean_collective_noun: "Cîr Númenóreans"
 new_numenorean_prefix: "Cîr Númenórean"
 new_numenorean_desc: "#size:15    Ever since the [akallabeth|E], and the shattering of the Númenórean colonial empire, the former [numenoreans|E] of [middleearth|E] have diverged. Separated by politics, religion, conflict, and sheer distance, the many Sons of [numenor|E] have long been divided. Now, with all of the old Númenórean Colonies under our rule, and the formation of Númenor-in-Exile, the Númenóreans are once again united!#"

 new_numenorean_adunaic: "Adûnâhin"
 new_numenorean_adunaic_ethnicity: "Adûnâhin"
 new_numenorean_adunaic_collective_noun: "Adûnâhin"
 new_numenorean_adunaic_prefix: "Adûnâhin"
 new_numenorean_adunaic_culture_desc: "#size:15    Ever since the [akallabeth|E], and the shattering of the Númenórean colonial empire, the former [numenoreans|E] of [middleearth|E] have diverged. Separated by politics, religion, conflict, and sheer distance, the many Sons of [numenor|E] have long been divided. Now, with all of the old Númenórean Colonies under our rule, and the formation of Númenor-in-Exile, the Númenóreans are once again united!#"

 ar_adunaim_numenorean: "Pharazônabênî"
 ar_adunaim_numenorean_ethnicity: "Pharazônabênî"
 ar_adunaim_numenorean_collective_noun: "Pharazônabênî"
 ar_adunaim_numenorean_prefix: "Pharazônabênî"
 ar_adunaim_numenorean_culture_desc: "#size:15    The Pharazônabênî (Adunaic: People of Pharazôn) are the insular and, according to many, detestable culture of [GetTitleByKey('e_adunaim').GetName]. An ostensibly proud and noble people, they seemingly exude the nobility and grace of [anadune|E]. In their grand halls and great palaces, one of sufficient [bloodofnumenor|e] would find themselves in the company of friends and the recipient of gifts and respect. However, if you are one that the Pharazônabênî consider 'lesser,'' you will find nothing but disdain, disrespect, and hostility. For the Pharazônabênî, their superiority and the inferiority of others is a simple fact of life. \n\nFormed after the Blood-Purists were exiled from [umbar|E], the Pharazônabênî haven't forgiven the Umbareans for all they have lost and the disgrace they levied upon them. For this and several other transgressions, a burning desire for revenge has grown in the hearts of many Pharazônabênî. Hatred for the 'other' runs deep in their society, and while they certainly will treat an Heir of [anadune|E] with respect, if you do not follow their ways, you may find many a cold shoulder.#"
 ar_adunaim_numenorean_loc: "Diverged from [CULTURE.GetName] by those who sought to bring purity to the [adunai|E]"

 kharatakhori: "Kharatakhôri"
 kharatakhori_ethnicity: "Kharatakhôric"
 kharatakhori_collective_noun: "Kharatakhôri"
 kharatakhori_prefix: "Kharatakhôric"
 kharatakhori_culture_desc: "#size:15    The Kharatakhôri are a people of many faces. They remember the days of their dominance in [anbalkumagan|E] and their fair rule in [thanihazad|E]. Combining the more domineering aspects of Anbalûkkhôri with the mercantile, equitable, and noble Kharadûnâi, the Kharatakhôri are a proud and just people. Reunited into one nation, the [adunai|E] of [thanihazad|E] have secured their eternal rule over the Seven Lands, and will govern with grace and cunning.  #"

 azralai: "Azralâi"
 azralai_collective_noun: "Azralâi"
 azralai_prefix: "Azralâi"
 azralai_ethnicity: "Azralâi"
 azralai_desc: "#size:15    For the first time in an age, Anarike is once more home to the [adunai|E]. Though many may question our heritage, or doubt the truth of our claim as heirs of [numenor|E], we pay them no heed. We have rekindled the flame of our ancient culture, and we are proud. Our people speak [adunaic|E] in their homes, scholars write in the script of our forefathers, and traders from across Ormal walk the harbors built with the craft and methods of [westernesse|E]. The culture of [numenor|E] lives again in Anarike. Though shaped in part by our neighbors of Khy, we stand now, and forever, as the true [adunai|E] of the East."

 eothedain: "Rohanedain"
 eothedain_collective_noun: "Rohanedain"
 eothedain_prefix: "Rohanedain"
 eothedain_ethnicity: "Rohanedain"
 eothedain_desc: "#size:15    Formed from [dunedain|E] settlers who made their home in [calenardhon|E] and the native [rohirrim|E], the Rohanedain are a singular fusion of two proud cultures. They have embraced the legacy of [rohan|E], preserving its traditions, songs, and celebrations, while never forgetting their [gondorian|E] roots, evident in their dress and the architecture they favor, drawn from the [southernkingdom|E].\n\nRenowned as great Horse-lords in their own right, the Rohanedain are unmatched among the [dunedain|E] in horsemanship. Many claim that a single Rohanedain and their steed are worth three [gondorian|E] horsemen. Proud of their blended heritage, this noble people may prove your staunchest ally, or your most unyielding foe."

 ##Traditions
 tradition_unified_dunedain_name: "A Unified Dúnedain"
 tradition_unified_dunedain_desc: "With the mending of [arnor|E] and [gondor|E], and the unification of the [dunedain|E], we stand ready to reclaim our glorious ancestry! United by our heritage, we embrace our shared legacy as descendants of [elendil|E], from whom the blood of [numenor|E] flows. Together, as one people united in purpose and destiny, let this be the age where the spirit of [westernesse|E] rises anew for generations yet unborn to marvel at and emulate. A new age begins for the Sons of [numenor|E]."

 tradition_unified_adunaic_name: "A Unified Adûnâi"
 tradition_unified_adunaic_desc: "With the unification of the [adunaic|E] peoples of [umbar|E], [bellakar|E], [anbalkumagan|E], and [thanihazad|E] we stand as the true successors of [numenor|E]! Never before have those Adûnâi of the south been as united as now, never our goals and efforts as focused. Together, as one people united in purpose and destiny, let this be the age where the spirit of [westernesse|E] rises anew for generations yet unborn to marvel at and emulate. A new age begins for the Sons of [numenor|E]."

 tradition_adunaic_legacy_name: "Adûnâic Legacy"
 tradition_adunaic_legacy_desc: "The [black_numenoreans|E], and the descendants of the several other Southern Colonies are our forebearers. From [umbar|E] and the ever vengeful [kingsmen|E], [bellakar|E] and their egalitarian [faithful|E], [anbalkumagan|E] and their endless depravity, and [thanihazad|E] and the machinations of the [balan_lai|E]. We are a storied people. We survived the [akallabeth|E]. We stretch the entire length of the [greatsea|E]. And we conquered, created kingdoms, and layed low those who opposed us. And so we will continue to do so into the [fourthage|E] and beyond."

 tradition_new_numenor_name: "Númenórean Reborn"
 tradition_new_numenor_desc: "Ever since the [akallabeth|E], and the shattering of the Númenórean colonial empire, the former [numenoreans|E] of [middleearth|E] have diverged. Separated by politics, religion, conflict, and sheer distance, the many Sons of [numenor|E] have long been divided. Now, with all of the old Númenórean Colonies under our rule, and the formation of Númenor-in-Exile, the Númenóreans are once again united!"

 tradition_fueled_by_vengeance_name: "Fueled by Vengeance"
 tradition_fueled_by_vengeance_desc: "The unjust [banofthevalar|E], the machinations of [sauroncharacter|E] and his provoking of the [akallabeth|E], the [warlastalliance|E] and the terrible losses of the [kingsmen|E], the endless civil wars and infighting of the [black_numenoreans|E], the loss of our rightful land in [umbar|E] to the plunderers of [gondor|E], and finally the prejudiced exile of the virtuous Blood-Purists from [umbar|E]. We are beset from all sides by traitors, rivals, and lesser men who wish to destroy the glory of [anadune|E]. We shall never let them! Not only that, but we will achieve our long-wanted vengeance! Slights will be punished, and the pain of the [adunai|E] shall never be forgotten. Every foe of our people will be vanquished, and we will take our place as the rightful Heirs of [middleearth|E], with all others beneath our feet."

 tradition_kharatakhori_name: "Kharatakhôric Legacy"
 tradition_kharatakhori_desc: "The [numenoreans|E] of the Southern Colonies are our forebearers. [thanihazad|E] is our home, and the land that has been proven time after time to be ours and ours alone. It is the nature of the world for the [adunai|E] to be its rulers, with other, lesser men below us."

 tradition_azralai_name: "Legacy of the Eastern Fleet"
 tradition_azralai_desc: "The Eastern Fleet was once anchored here in Anarike, its proud ships calling these shores home. For many, life was lived upon the waves, for others, it was spent in the drydocks, tending the havens, or working the fields to supply the Fleet’s unceasing hunger for provisions and trade. Though the great sails of the Fleet have long since vanished beyond the horizon, their legacy endures. The Sea still shapes the soul of Anarike, its rhythms, its labors, and its dreams. Exploration, seafaring, and commerce remain the lifeblood of the Eastern [adunai|E], echoing the days when the tide itself bore the will of [numenor|E]."

 ##Innovations 
 innovation_lords_of_the_golden_lands: "Lords of the Golden Lands"
 innovation_lords_of_the_golden_lands_desc: "Having risen like a phoenix from the ashes, the Adûnâi have established their supremacy in the Golden Lands, a new age of the world dawning under their stewardship."

 innovation_unified_adunai_warfare: "Soldiers of the Adûnâi"
 innovation_unified_adunai_warfare_desc: "The Adûnâi retain much of the strength of their Númenorean forefathers and field among the fiercest armies in all of Middle-earth."  

 innovation_numenorean_warriors_custom: "Soldiers of Númenor"
 innovation_numenorean_warriors_custom_desc: "The soldiers of [numenor|E], blessed with the wisdom and craft of the [eldar|E] and the teachings of [eonwecharacter|E], were worth 20 lesser men. Their steel-bows struck fear into all that faced them, and few were the foes that could breach their armour."

 innovation_numenorean_warriors_adunaic: "Soldiers of Númenor"
 innovation_numenorean_warriors_adunaic_desc: "The soldiers of [numenor|E], blessed with the wisdom and craft of the [eldar|E] and the teachings of [eonwecharacter|E], were worth 20 lesser men. Their steel-bows struck fear into all that faced them, and few were the foes that could breach their armour."

 innovation_dunedain_warriors_steelbow: "Soldiers of the Dúnedain"
 innovation_dunedain_warriors_steelbow_desc: "The Dúnedain retain much of the strength and wisdom of their Númenórean forefathers and field among the fiercest armies in all of Middle-earth."

