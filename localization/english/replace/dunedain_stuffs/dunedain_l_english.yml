 ##Artifacts
 arnorian_figurine_name: "Arnorian Figurine"
 arnorian_figurine_description: "This exquisite stone carving, weathered by time, was discovered in a [arnorian|E] ruin, long forgotten. Its incredibly lifelike appearance is a credit to the art of the craftsmen in [arnor|E] of old."
 
 arnorian_helm_name: "Arnorian Helm"
 arnorian_helm_description: "This ancient winged helm is of a design not seen in [middleearth|E] for many a year, not since the dark years following the Fall of [arnor|E]. This fine helm can withstand all but the mightiest of blows, a testament to the skill of [arnorian|E] craftsmen."
 
 arnorian_shield_name: "Arnorian Shield"
 arnorian_shield_description: "This ancient, faded shield bears the arms of the Kings of [arthedain|E] of old. It was discovered in the remains of a forgotten [arnorian|E] armoury and carefully restored to splendour by an antiquarian."
 
 arnorian_steelbow_name: "Arnorian Steelbow"
 arnorian_steelbow_description: "The [numenorean|E] Steelbow was a legendary weapon of the [dunedain|E]. It was made of hollow steel, somewhat shorter than the average longbow. The [numenorean|E] Steelbow grew rare in the [thirdage|E], though some within [arnor|E] wielded them even unto the fall of the kingdom. This [arnorian|E] Steelbow, preserved in remarkable condition, has with careful restoration surpass any bow crafted in modern times."
 