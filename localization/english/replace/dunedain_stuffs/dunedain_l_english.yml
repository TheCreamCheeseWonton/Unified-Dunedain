 custom_building_construction_special_character3: "Building Armenelostion - Insane Commitment"
 custom_building_construction_special_character3_desc: "This character spends every waking moment fixated on building [GetBuilding('wonder_anonarmenlos_01').GetName], sundering them as inept in other areas of governance."

