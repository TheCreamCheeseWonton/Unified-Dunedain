 custom_add_cultural_acceptance_gain_for_nie: "Numenorean Revival"
 custom_add_cultural_acceptance_gain_for_nie_desc: "With the establishment of Númenor-in-Exile, the many different cultures descendant from [numenor|E] have been united into one state, and have thus begun to mingle and find their differences fewer and fewer by the day."
 custom_building_construction_special: "Armenelostion Under Construction"
 custom_building_construction_special_desc: "The city of Armenelostion is under construction in this county. The lofty ambitions of the construction are to recapture the splendor and awe of [armenelos|E] in [numenor|E]. It has brought many builders and settlers to the islands, along with their commerce."

