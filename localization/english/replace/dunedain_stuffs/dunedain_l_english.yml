 #Modifiers
 lotr_pharazain_separatism_county_modifier: "Open Revolt"
 lotr_pharazain_separatism_county_modifier_desc: "The people of this county have risen in open rebellion against the Golden Throne. They will resist to the bitter end, refusing to submit to your rule."

 lotr_pharazain_fighting_separatism_county_modifier: "Open War"
 lotr_pharazain_fighting_separatism_county_modifier_desc: "The people of this county are engaged in active civil war against your armies. They resist fiercely, but loyalist forces are closing in to restore order."

 lotr_fighting_separatism_character_modifier: "The Civil War"
 lotr_fighting_separatism_character_modifier_desc: "Much of your time, wealth, and army is consumed in extinguishing the fires of rebellion across your realm. Your people suffer, your authority wanes with each passing day, and both men and gold are devoured by the relentless blaze of war."

 lotr_shattered_control_county_modifier: "Shattered Control"
 lotr_shattered_control_county_modifier_desc: "The [GetTitleByKey('e_pharazain').GetName] has lost nearly all control on this county in the wake of [GetTitleByKey('e_pharazain').GetNameNoTier] Civil War."

 lotr_pharazain_integration_county_modifier: "Integration Woes"
 lotr_pharazain_integration_county_modifier_desc: "This county is being integrated into the broader, reformed administration of [GetTitleByKey('e_pharazain').GetNameNoTier]. During this process, however, the county will be highly inefficient and contribute little to the war effort."

 lotr_integration_complete_character_modifier: "Lessons of the Civil War"
 lotr_integration_complete_character_modifier_desc: "This character guided their great realm through the long and terrible years of the [GetTitleByKey('e_pharazain').GetNameNoTier] Civil War. This ordeal taught them invaluable lessons in statecraft and the most effective ways to suppress rebellion."

 lotr_broken_domain_admin_character_modifier: "Broken Administration: Domain"
 lotr_broken_domain_admin_character_modifier_desc: "The Civil War has torn the realm’s administration apart, collapsing it inward like a vast house of cards. Even the loyal provinces struggle under the weight of chaos, as basic governance falters and the state teeters on the brink of collapse."

 lotr_broken_domain_admin_getting_better_character_modifier: "Improving Administration: Domain"
 lotr_broken_domain_admin_getting_better_character_modifier_desc: "The Civil War has torn the realm’s administration apart, collapsing it inward like a house of cards. We are pouring vast sums of money and effort into stabilizing the bureaucracy, yet before improvement can take hold, the situation is destined to worsen."

 lotr_broken_military_admin_character_modifier: "Broken Administration: Military"
 lotr_broken_military_admin_character_modifier_desc: "The Civil War has shattered our once-mighty army. Hunted by the very people they once swore to protect, many defect to the rebel cause, and those who remain are scattered, disorganized, and cut off from the rest of the realm."

 lotr_broken_military_admin_getting_better_character_modifier: "Improving Administration: Military"
 lotr_broken_military_admin_getting_better_character_modifier_desc: "The Civil War has shattered our once-mighty army. We are pouring vast sums of money and effort into strengthening our shattered military and rearming the scattered remnants of our forces, yet before improvement can take hold, the situation is destined to worsen."

 lotr_broken_tax_admin_character_modifier: "Broken Administration: Tax Collection"
 lotr_broken_tax_admin_character_modifier_desc: "The Civil War has all but destroyed our ability to collect taxes. Tax collectors are being slain in large numbers, many dominions under rebel control refuse to pay any tribute, and others are isolated, too preoccupied with survival to contribute. Our coffers grow worryingly empty."

 lotr_broken_tax_admin_getting_better_character_modifier: "Improving Administration: Tax Collection"
 lotr_broken_tax_admin_getting_better_character_modifier_desc: "The Civil War has all but destroyed our ability to collect taxes. We are pouring vast sums of money and effort into stabilizing the bureaucracy of our tax administration, yet before improvement can take hold, the situation is destined to worsen."

 lotr_admin_into_admin_character_modifier: "Forming an Administrative Government"
 lotr_admin_into_admin_character_modifier_desc: "This character is devoting much of their time to reforming the Imperial Bureaucracy, with the goal of forging a powerful [administrative|E] realm."

 lotr_admin_into_faudal_character_modifier: "Reforming the Feudal Government"
 lotr_admin_into_faudal_character_modifier_desc: "This character is devoting much of their time to reforming the Imperial Bureaucracy, striving to forge a powerful and absolute [feudal|E] realm."

 ##Misc
 innovation_adunai_administration_feudal: "Adûnâic Feudal Structure"
 innovation_adunai_administration_feudal_desc: "Through the trials and tribulations of the [GetTitleByKey('e_pharazain').GetNameNoTier] Civil War, the [adunai|E] of the south endured great hardship and devastation. Yet from the fire they rose like a phoenix from the ashes, and the Golden Dominion emerged with newfound wisdom in statecraft and stability. \n\nAmong the greatest legacies of this struggle was the reformed [adunaic|E] Feudal Structure, which greatly enhanced the lords’ ability to govern effectively, ushering in an age of prosperity for all under the [GetTitleByKey('e_pharazain').GetName]."

 innovation_adunai_administration_admin: "Adûnâic Administrative Structure"
 innovation_adunai_administration_admin_desc: "Through the trials and tribulations of the [GetTitleByKey('e_pharazain').GetNameNoTier] Civil War, the [adunai|E] of the south endured great hardship and devastation. Yet from the fire they rose like a phoenix from the ashes, and the Golden Dominion emerged with newfound wisdom in statecraft and stability. \n\nAmong the greatest legacies of this struggle was the reformed [adunaic|E] Administrative Structure, which greatly enhanced the ability of the central government to govern effectively, ushering in an age of prosperity for all under the [GetTitleByKey('e_pharazain').GetName]."

 decision_solidify_pharazain_no_more_separatism_tt: "The [GetTitleByKey('e_pharazain').GetNameNoTier] Civil War has came to an end"
 decision_solidify_pharazain_integrated_everything_tt: "All [kingdom|E] [titles|E] in [GetGeographicalRegion('special_pharazain').GetName] have been fully integrated into the realm"
 decision_solidify_pharazain_reformed_admin_tt: "The Government Administration of [GetTitleByKey('e_pharazain').GetNameNoTier] has successfully been reformed"

 valid_pharazain_separatism_delt_with_tt: "No [county|E] in [GetGeographicalRegion('special_pharazain').GetName] has the [GetModifier('lotr_pharazain_fighting_separatism_county_modifier').GetNameWithTooltip] [modifier|E]"

 valid_pharazain_integration_delt_with_tt: "No [county|E] in [GetGeographicalRegion('special_pharazain').GetName] has the [GetModifier('lotr_pharazain_integration_county_modifier').GetNameWithTooltip] [modifier|E]"

 nick_pharazain_golden: "an-Pharazir"
 nick_pharazain_golden_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], hailed as an-Pharazir, 'The Golden One,' is remembered for bringing into being the [GetTitleByKey('e_pharazain').GetName], the fulfillment of a long-cherished dream. After enduring decades of Civil War and unrest, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] secured [CharYourHerHis(CHARACTER)] empire through wit, courage, and unyielding resolve. In time, [CharYouSheHe(CHARACTER)] not only established but also cemented dominion over the greatest realm of the [adunai|E], if not all [men|E], in [middleearth|E]."

 ##Events
 dunedain_identity.1.t: "The Language Question"
 dunedain_identity.1.desc: "Now that the [dunedain|E] have been reunited, a question has arisen on what language our people will use. Those of [gondor|E] request that we use Westron as the language of the [dunedain|E]. The people of [arnor|E], and many other groups in the north call to use [sindarin|E], as was custom for the [faithful|E] [numenoreans|E]. Which of these two languages should we use?"
 dunedain_identity.1.a: "Westron, language of the [gondor|E] and of the [westlands|E], shall be our language!"
 dunedain_identity.1.b: "Sindarin, language of the [faithful|E] [numenoreans|E] and the [elves|E], shall be our language!"
 decision_reunify_dunedain_characters_custom: "All Dúnedan Heritage [characters|e]"
 decision_reunify_dunedain_counties_custom2: "All Dúnedan Heritage [counties|e]"

 dunedain_identity_westron: "The [dunedain|E] shall adopt Westron as its day-to-day tongue"
 dunedain_identity_sindarin: "The [dunedain|E] shall adopt Sindarin as its day-to-day tongue"

 #Rohan Eventline
 dunedain_identity.2.t: "An Envoy to Rohan"
 dunedain_identity.2.desc: "[rohan|E] has long been an ally of [gondor|E], and now we are presented with a rare and momentous chance, to unite with our northern neighbor. Never since the founding of [rohan|E] has such a prospect seemed possible, yet a [dunedain|E] now ascends the throne of that realm. In the wake of their aid in the downfall of [sauroncharacter|E], the strength of our bonds, and the peace and prosperity that have followed, the lords of [rohan|E] may at last be persuaded to join in union with [gondor|E].\n\nWe must dispatch an envoy to [GetTitleByKey('b_edoras').GetNameNoTier] without delay!"
 dunedain_identity.2.a: "The Envoy is ready, lets see if this works"

 dunedain_identity.3.t: "An Envoy from Gondor"
 dunedain_identity.3.desc: "An envoy under the employ of the ruler of [gondor|E] entered our court early in the morning today, asking for an audience with [ROOT.Char.GetFirstName]. They gave us a treaty, one they expect us to sign. It would make us a vassal of [gondor|E]. We would lose our independence, but would give our people some amount of the prosperity [gondor|E] has been seeing as of late. Should we accept?"
 dunedain_identity.3.a: "Tell the King of [gondor|E] that he is my King"
 dunedain_identity.3.b: "[gondor|E] gave us [rohan|E], and now they want it back? Never!"

 dunedain_identity.4.t: "Rohan Accepts!"
 dunedain_identity.4.desc: "[rohan|E] has accepted our terms! With [rohan_title.GetTitledFirstName]’s seal upon the treaty, [calenardhon|E] is once more restored as a province of [gondor|E]. Already, many of the [dunedain|E] seize the opportunity to settle in the wide and open lands of the former Kingdom of [rohan|E], forging new lives in our northern province.\n\nThough some among the [rohirrim|E] have voiced their discontent at this change, few can deny the great boon it brings to the prosperity of [calenardhon|E], which grows swiftly with each passing day. In time, the [rohirrim|E] and the [dunedain|E] shall learn to dwell side by side, their friendship enduring, now bound not only by the sword, but by a shared nation.\n\nThus does [gondor|E] once again rule over [calenardhon|E]!"
 dunedain_identity.4.a: "Never again will [gondor|E] be sundered!"

 dunedain_identity.5.t: "Rohan Rufused!"
 dunedain_identity.5.desc: "Alas, [rohan|E] has rejected our terms. Though [rohan_title.GetTitledFirstName] heard our envoys with courtesy, no signature was set upon the treaty, and [rohan|E] remains apart from [gondor|E]. Many among the [dunedain|E] had hoped to return and settle once more in those wide and open lands, yet their hopes are now no more.\n\nSome within [gondor|E] grumble that such refusal is an insult after our shared triumph over [sauroncharacter|E], while others caution that pressing the matter further may break the bond of friendship that has long endured between our [rohan|E] and [gondor|E]. For now, [rohan|E] stands firm in its independence, and [calenardhon|E] remains beyond our rule."
 dunedain_identity.5.a: "The dream of Calenardhon will not be achieved this day."

 dunedain_identity.6.t: "Reaquiring [GetTitleByKey('c_minas_ithil').GetNameNoTier]"
 dunedain_identity.6.desc: "[minasithil|E], like the rest of Ithilien, has come a long way since the founding of the Princedom. Once a land shrouded in shadow, disease, and decay, it has bloomed anew into a realm of gardens and flowers. The corruption of the [witchking|E] has been cleansed, and [minasithil|E] once more stands as a proud city of the [dunedain|E]. The Princes swore to relinquish the city upon the completion of their duty, and that time has now come."
 dunedain_identity.6.a: "[minasithil|E], again city of the Crown of [gondor|E]"
 dunedain_identity.6.b: "The Prince of Ithilien shall keep [minasithil|E] for now"

 dunedain_identity.7.t: "Dealing with [aldburg_title.GetTitledFirstName]"
 dunedain_identity.7.desc: "With the declaration that [GetTitleByKey('c_aldburg').GetNameNoTier] shall once again serve as the capital of [GetTitleByKey('k_rohan').GetNameNoTier], an issue has come to light. [rohan_title.GetTitledFirstName] does not, in fact, hold the new capital of their own province! This matter must be swiftly resolved, so that an orderly transfer of power may be secured.\n\nFortunately, [aldburg_title.GetTitledFirstName], current lord of [GetTitleByKey('c_aldburg').GetNameNoTier], has agreed to relinquish the city to [rohan_title.GetTitledFirstName], but only under heavy conditions. He demands that he and his heirs be guaranteed a permanent seat upon [GetTitleByKey('k_rohan').GetNameNoTier]’s council, that they be adorned with honors of high esteem, and that a great sum of gold be granted to them.\n\nShall we yield to these demands?"
 dunedain_identity.7.a: "Of course, such requests are only just."
 dunedain_identity.7.b: "We will take the city and he will like it!"
 dunedain_identity.7.c: "His demands aren’t worth the gain, leave it be."

 dunedain_identity.8.t: "The Binding of Gondor and the Mark"
 dunedain_identity.8.desc: "With the stroke of a pen, an event long thought impossible has come to pass. The realm of the Horse-lords, [rohan|E], and the Land of the White Tree, [gondor|E], are now united beneath the crown of [high_king_gondor.GetName]. The [rohirrim|E] and the [dunedain|E] march forward as brethren under a single banner, together a force so formidable that few could hope to stand against them. Once more, the forces of Evil find themselves on the retreat in the face of the might of the [west|E]."
 dunedain_identity.8.a: "All hail [high_king_gondor.GetName]!"
 dunedain_identity.8.b: "No matter, the two fall more grievously than one."
 dunedain_identity.8.c: "Who cares about some wild horse-men?"

 dunedain_identity.9.t: "The Emergence of the Rohanedain"
 dunedain_identity.9.desc: "The [dunedain|E] have ruled the former Kingdom of [rohan|E] for many years, and the integration of this province has gone smoothly. The [rohirrim|E], long allies of [gondor|E], have accepted our rule, and the prosperity brought under our banner has allowed them to grow wealthier than they ever dreamed. Many families of the [dunedain|E] have since settled in the region, establishing themselves along the northern [gondorian|E] frontier.\n\nNow, as the first generations born in [calenardhon|E] come of age, a remarkable phenomenon is taking shape. In the areas with the greatest number of settlers, a new culture is emerging, one that blends the traditions, customs, and ideals of both [dunedain|E] and the [rohirrim|E]. These people are proud [dunedain|E] of [calenardhon|E], calling the province their homeland, yet they also honor their [rohirrim|E] heritage and the legacy of [rohan|E]. \n\nWhat should be our response to this ongoing incident?"
 dunedain_identity.9.a: "My home is Calenardhon, and I am of the Rohanedain."
 dunedain_identity.9.b: "Never will I abandon my traditions!"
 dunedain_identity.9.c: "A welcome change, one that should strengthen [dunedain|E] rule."
 dunedain_identity.9.d: "My home is Calenardhon, and I am of the Dunedain"
 dunedain_identity.9.e: "Never will I abandon my traditions!"
 dunedain_identity.9.f: "A welcome change, one that should strengthen [dunedain|E] rule."
 dunedain_identity_eothedain_tooltip: "All [dunedain|E] [heritage|E] [counties|E] in [GetGeographicalRegion('middleearth_west_rohan').GetName] will be converted to the #V [eothedain_culture.GetName]#! [culture|E]"


 east_adunaic.0010.t: "The Eastern Adûnâic Revival"
 east_adunaic.0010.desc: "Something once deemed impossible, something beyond our grasp, has now come to fruition. A momentous event, one that will lift our people from the shadows and into the radiant light of the future. Though some among the general populace have resisted this new reality, the [adunai|E] of the East have been reborn! \n\nOur people now speak the language of our ancestors and once again follow the ancient customs of [numenor|E]. The sea calls to us, and we yearn to return to its embrace. May the Azralâi forever rule the waters and uphold the legacy of our traditions! Long live the [adunai|E]!"
 east_adunaic.0010.a: "These shores shall again be home of the Adûnâi"


 south_adunai_events.1.t: "Union of Kharat Ephalaim"
 south_adunai_events.1.desc: "Today will be a historic day in the annals of history. For the first time since the [akallabeth|E], the [adunai|E] of the south have ended their rivalry and united under one nation. Brought together, mingled and traded with one another, and broke the barriers between each other, finally, we are one. The Anbalûkkhôri and Kharadûnâi have been ever-bickering enemies, but now our efforts have brought both together as one people. The [fourthage|E] will be the age of the [adunai|E] of the south!"
  south_adunai_events.1.a: "The [adunai|E] of the south, one and the same."

 south_adunai_events.2.t: "The Rise of House Gimilzîr"
 south_adunai_events.2.desc: "House Gimilzîr has always been a small, insular, but close-knit family. Taking care of their own, not interacting much with those outside their palace in [GetTitleByKey('c_mispir').GetNameNoTier]. Able to trace their bloodline back to [elrosshort|E] himself, they retain some of the purest [bloodofnumenor|E] in all of [thanihazad|E] which has afforded them some amount of renown. After [gimilziran|E]'s failed conquests in the early [thirdage|E], this is how the family lingered. Rotting as their ancient palace built by [gimilziran|E] gathered dust and slowly crumbled away.\n\nHowever, [GetScriptedCharacterByHistoryID( 'linegimilzadan01' ).GetFirstNameNicknamed] Gimilzîr, changed the tune of the family forever. The [stormhost|E] invaded [thanihazad|E] early in the man's life, and returning the call of the [balan_lai|E] [GetScriptedCharacterByHistoryID( 'linegimilzadan01' ).GetFirstNameNicknamed] came to their aid as a Knight of Kharadûne. During a seige on [GetTitleByKey('c_mispir').GetNameNoTier], the ancient Palace of Gimilzîr was rassed, and reduced to rubble by the [stormhost|E] army. Since that day the Gimilzîr family has been without an estate, following the head of their House wherever they may go. [GetScriptedCharacterByHistoryID( 'linegimilzadan01' ).GetFirstNameNicknamed] fought valiantly and served for most of his life, becoming the personal champion of [GetScriptedCharacterByHistoryID( 'lineofgimilthani47' ).GetFirstNameNicknamed]. He won the Gimilzîr family much honor with his many great deeds in those days, of which he is remembered quite fondly by all who knew him. \n\nMuch like his grandfather before him, [GetScriptedCharacterByHistoryID( 'linegimilzadan1' ).GetFirstNameNicknamed] also joined the Knights at the young age of 24. There he rose through the ranks at lightning speed. He quickly made a name for himself as one of the greatest knights in the history of [thanihazad|E], with some even saying he rivaled his Grandfather. However, after a particularly bad wound, and the news of his newborn son, [GetScriptedCharacterByHistoryID( 'linegimilzadan1' ).GetFirstNameNicknamed] left the knights to see after his family. Now, at the young age of 19 [GetScriptedCharacterByHistoryID( 'linegimilzadan2' ).GetFirstNameNicknamed] was gifted by his father the honor of becoming head of House Gimilzîr. The young man was not ready for such a great responsibility, fearing he would let down his family and fail to rise to the great heights of his Father and Great-Grandfather, and he did not dare think of even approaching the brilliance of [gimilziran|E]. [GetScriptedCharacterByHistoryID( 'linegimilzadan1' ).GetFirstNameNicknamed] nonetheless believes in his son and sees him as a true heir of [numenor|E], with the wits and grace to forge a destiny greater than any other in House Gimilzîr, and to possibly, even fulfill the lamented dream of [gimilziran|E]."
  south_adunai_events.2.a: "We all have hope in the young [GetScriptedCharacterByHistoryID( 'linegimilzadan2' ).GetFirstNameNicknamed]!"

##\n\n #VNote!#bold For #TÂrûgimil#! to prove his worth he must gain atleast 5000 [prestige|E].

 pharazain_events.1.t: "Union of The Adûnâi"
 pharazain_events.1.desc: "Today we renew our vows and reaffirm our commitment to an undivided, indivisible union.\n\nSince its proclamation, the Golden Dominion has served chiefly as an administrative body, often struggling to coordinate the many disparate realms of the [adunai|E]. This task was made all the harder by the fact that much of the land we claimed as ours did not, in truth, lie beneath our banner. Yet through tireless effort, our labor has borne fruit.\n\nA profound transformation is already underway. The peoples of [bellakar|E], [anbalkumagan|E], and [thanihazad|E] alike have begun to see themselves as one with [GetTitleByKey('e_pharazain').GetNameNoTier]. Reconstruction has reached its close; our cities are rebuilt, repopulated, and restored to their rightful place as the homes of true [adunaic|E] folk.\n\nFrom the northern reaches of [GetTitleByKey('k_mardruak').GetNameNoTier], to the wealth of [GetTitleByKey('c_nilulonde').GetNameNoTier], and as far south as [GetTitleByKey('c_mispir').GetNameNoTier], the people now recognize themselves as part of a single realm. After millennia of division and strife, the lands of the [adunai|E] at last stand united beneath one King!"
  pharazain_events.1.a: "The Golden Lands, indivisible and eternal."

 pharazain_events.2.t: "Sons of Anadûnê"
 pharazain_events.2.desc: "For too long have the [adunai|E] of these lands remained divided, their ancient bonds broken by time and circumstance. With the mending of the once-sundered realms, we stand ready to reclaim our glorious ancestry!\n\nUnited by our heritage, we embrace our shared legacy as descendants of [numenor|E], from whom the [bloodofnumenor|E] flows.\n\nTogether, as one people united in purpose and destiny, let this be the age where the spirit of [numenor|E] rises anew for generations yet unborn to marvel at and emulate."
 pharazain_events.2.a: "Today marks the restoration of our Adûnâic heritage."

 pharazain_events.3.t: "The Language Question"
 pharazain_events.3.desc: "Now that the [adunai|E] have been reunited, a question has arisen on what language our people will use, with there being many different voices in the matter. Some wish for us to revive the language of our [numenorean|E] forefathers, High Adûnâic, which has been dead since not long after the [akallabeth|E]. The many different modern [adunai|E] wish for us to use their dialect of [adunaic|E], and abandon all the rest to create one true [adunaic|E] language. At last, some within our nation propose the creation of a new [adunaic|E] tongue, one that shows no favor to any people within our borders. Which of these languages should we use?"
 pharazain_events.3.a: "High Adûnâic, language of our [numenorean|E] forefathers, shall be our language!"
 pharazain_events.3.b: "Pharazûnâic, a new language of both [bellakar|E] and [thanihazad|E], shall be our language!"
 pharazain_events.3.c: "Belladûnâic, language of the [faithful|E] of [bellakar|E], shall be our language!"
 pharazain_events.3.d: "Kharadûnâic, language of the proud people of [thanihazad|E], shall be our language!"

 pharazaini_culture_identity_adunaic: "The [adunai|E] shall adopt High Adûnâic as its day-to-day tongue"
 pharazaini_culture_identity_bellakar: "The [adunai|E] shall adopt Belladûnâic as its day-to-day tongue"
 pharazaini_culture_identity_kharadunaic: "The [adunai|E] shall adopt Kharadûnâic as its day-to-day tongue"
 pharazaini_culture_identity_new: "The [adunai|E] shall adopt Pharazûnâic as its day-to-day tongue"

 numenor_identity.1.t: "The Language Question" 
 numenor_identity.1.desc: "Now that the [numenoreans|E] have been reunited, a question has arisen on what language we should use. The people of [gondor|E] request that we use Westron as the Cîr Númenórean language. The [dunedain|E] and many other groups in the north calls to use [sindarin|E], as was custom for the [faithful|E] [numenoreans|E]. A third group, quite small in number, wishes for us to use High [elven|E] [quenya|E] as our language. A final, fourth group, mainly from the southern coasts, calls to use [adunaic|E], the old original language of [numenor|E]. What language should we use?"
 numenor_identity.1.a: "Westron, language of the [dunedain|E] and the north, shall be our language!"
 numenor_identity.1.b: "Sindarin, language of the [faithful|E] [numenoreans|E] and the Elves, shall be our language!"
 numenor_identity.1.c: "Quenya, language of the lore on [numenor|E], and of the High [elves|E], shall be our language!"
 numenor_identity.1.e: "Adûnaic, language of the [kingsmen|E], and of the native [numenoreans|E], shall be our language!"

 numenor_identity.2.t: "The Language Question"
 numenor_identity.2.desc: "Now that the [numenoreans|E] have been reunited, a question has arisen on what language we should use. Some wish for us to revive the language of our [numenorean|E] forefathers, High Adûnâic, the old original language of [numenor|E]. The many different modern [adunai|E] wish for us to use their dialect of [adunaic|E], and abandon all the rest to create one true [adunaic|E] language. And more [faithful|E] noobles in [umbar|E] wish to adopt Southron. And finally, the people of [gondor|E] and [arnor|E] request that we use Westron as the Adûnâhin language. Which of these languages should we use?"
 numenor_identity.2.a: "High Adûnâic, language of our [numenorean|E] forefathers, shall be our language!"
 numenor_identity.2.b: "Umbarean Adûnâic, language of the [umbar|E] [kingsmen|E], shall be our language!"
 numenor_identity.2.c: "Belladûnâic, language of the [faithful|E] of [bellakar|E], shall be our language!"
 numenor_identity.2.d: "Kharadûnâic, language of the proud people of [thanihazad|E], shall be our language!"
 numenor_identity.2.e: "Southron, language of the [faithful|E] of [umbar|E], shall be our language!"
 numenor_identity.2.f: "Westron, language of the [dunedain|E] and the north, shall be our language!"

 numenor_identity_adunaic: "The [numenoreans|E] shall adopt High Adûnâic as its day-to-day tongue"
 numenor_identity_umbar: "The [numenoreans|E] shall adopt Umbarean Adûnâic as its day-to-day tongue"
 numenor_identity_bellakar: "The [numenoreans|E] shall adopt Belladûnâic as its day-to-day tongue"
 numenor_identity_kharadunaic: "The [numenoreans|E] shall adopt Kharadûnâic as its day-to-day tongue"
 numenor_identity_westron: "The [numenoreans|E] shall adopt Southron as its day-to-day tongue"
 numenor_identity_westron2: "The [numenoreans|E] shall adopt Westron as its day-to-day tongue"

 lotr_anonarmenlos.1.t: "The Rebuilding of Armenelos in Middle-earth"
 lotr_anonarmenlos.1.desc: "[armenelos|E], the grand capital of [numenor|E], was in the days before the [akallabeth|E] the greatest and fairest city of [men|E], and perhaps of all [conceptraces|El] in [middleearth|E]. Its white walls and tall towers were the inspiration for many of the great cities of the [dunedain|E] such as the three cities of [minasanor|E], [osgiliath|E], and [minasithil|E]. Even so, a city of its quality was never again achieved by any of the many descendants of [numenor|E]. We hope to change that. With a significant sum of [gold|El] and the efforts of our entire nation behind us, we can attempt to reach the great heights of [armenelos|E]. Forging a great successor to its splendor never before seen in [middleearth|E]. The question is however, how much are we willing to spend?"
 lotr_anonarmenlos.1.a: "No sacrifice will be too great to construct Armenelostion"
 lotr_anonarmenlos.1.a.tt: "In 10 years, [GetBuilding('wonder_anonarmenlos_01').GetName] will finish construction"
 lotr_anonarmenlos.1.b: "Every effort will be made to build this Great City"
 lotr_anonarmenlos.1.b.tt: "In 25 years, [GetBuilding('wonder_anonarmenlos_01').GetName] will finish construction"
 lotr_anonarmenlos.1.c: "With our whole nation behind us, Armenelos will be born anew"
 lotr_anonarmenlos.1.c.tt: "In 50 years, [GetBuilding('wonder_anonarmenlos_01').GetName] will finally finish construction"
 lotr_anonarmenlos_debuff_remove_once_completed: "Once construction has been completed, the modifier above will be removed. \nIf you die your [heir|E] will inherit the modifier"

 lotr_anonarmenlos.2.t: "Armenelos Reborn"
 lotr_anonarmenlos.2.desc: "At last, after years of dedication, time, [gold|El], and so much more, Armenelostion has finally been completed. The 'Son of [armenelos|E]' has become a city unrivaled in all of [middleearth|E]. Her newly founded havens already are a bustle with life and commerce, her broad streets flowing with [men|El] of the [faithful|E]. Still many more [men|e] from all corners of the world already have begun to travel here to see her sights and experience her wonder. Never since the [akallabeth] has such a graceful and wonderous city been the home of [man|E]. But here we now are, with a city unrivaled built upon Sacred Islands of white sands. A new age has been born, an age reminiscent of ages past!"
 lotr_anonarmenlos.2.a: "[GetBuilding('wonder_anonarmenlos_01').GetName] has been completed, ushering in a new age of prosperity"

 south_adunai_events.4.t: "The Settling of Tantûrak"
 south_adunai_events.4.desc: "Already, thousands of colonists from [GetTitleByKey('e_thani_hazad').GetNameNoTier] have arrived in [GetTitleByKey('c_sarul').GetNameNoTier], and still hundreds more arrive each day. Some seek adventure in the jungle, others flee persecution, and many dream of claiming land of their own. Whatever their reasons, these brave souls are here, and they are here to stay.\n\nYet not all goes according to plan. The local tribes fight fiercely for every inch of ground, showing no signs of surrender. Taming these wild jungles will be no easy task, but they will be tamed. For we are the [adunai|E], masters of the world! \n\nBut what of our colonists? What culture should they take up?"
 south_adunai_events.4.a: "Both Myself and Tantûrak shall become #E Tanturaki#!"
 south_adunai_events.4.b: "Tantûrak shall become #E Tanturaki#!"
 south_adunai_events.4.c: "Tantûrak shall adopt my own [culture|E]"

 #Modified Base Event
 bellakar.0300.t: "The Golden Lands"
 bellakar.0300.desc: "Once, the lands of Southwestern [middleearth|E] were dominated by the strength of mighty [numenor|e]. Though divided, these [numenorean|E] colonies south of [GetTitleByKey('k_umbar').GetNameNoTier] came to be known in the homeland as [GetTitleByKey('e_pharazain').GetNameNoTier] - the Golden Lands, from which riches flowed to the Isle of the Star.\n\nYet since the [downfallofnumenor|E] an Age ago, these lands have stood divided; petty kingdoms and realms that have fought amongst each other for countless years, waxing and waning over time. Yet the memory of [numenor|E] still lived on, and so did the faint idea of the golden lands of [GetTitleByKey('e_pharazain').GetNameNoTierNoTooltip].\n\nFinally, under my banner, much the former colonies of the south have been united, and the memory of that ancient name may now finally be reborn with newfound purpose!"
 bellakar.0300.a: "Glory to the Golden Dominion of [GetTitleByKey('e_pharazain').GetNameNoTierNoTooltip]!"


 #Blocker Events
 wastelands_custom.001.t: "[obstacle_province.GetName]: Hidden Bandit Camp"
 wastelands_custom.001.desc: "The ruins of [arnor|E] lie in desolation. Abandoned by their [dunedain|E] inhabitants and shunned even by the few who still dwell in [eriador|E]. In truth, one could dwell within these scattered remnants for years without ever glimpsing another soul.\n\nYet this solitude has proven deceptive. As our settlers labored to clear an ancient fortification from the [angmar_wars|E], they were set upon by bandits hitherto unknown. Several were slain before the local guard could muster a response. Now these marauders strike at our colony with increasing boldness, spreading fear and ruin throughout [obstacle_province.GetName]. If our settlement is to endure, these brigands must be dealt with, one way or another. I must decide what course to take against this new threat..."
 wastelands_custom.001.a: "Bribe them to move elsewhere."
 wastelands_custom.001.success.toast.t: "You Scatter the Bandits"
 wastelands_custom.001.failure.toast.t: "You Fail to Scatter the Bandits"
 wastelands_custom.001.a.duel_success: "The Bandits move elsewhere"
 wastelands_custom.001.a.duel_failure: "The Bandits steel your money"
 wastelands_custom.001.b: "Rally a Force and Assault the Camp!"
 wastelands_custom.001.b.duel_success: "Your men slay the bandits"
 wastelands_custom.001.b.duel_failure: "Your men are driven back by the bandits"
 wastelands_custom.001.c: "Abandon the colony, it is no longer worth the effort"

 wastelands_custom.002.t: "[obstacle_province.GetName]: Preserved Structures"
 wastelands_custom.002.desc: "Many of the ruins that litter [arnor|E] are beyond repair, broken first by decades of war and left to crumble through long millennia of abandonment.\n\nYet in [obstacle_province.GetName], our settlers have uncovered a scattering of structures still standing amidst the remains of an old fortress. Markets, homes, stables, all in a state surprisingly sound for their age. Though the stronghold itself was laid low in the [angmar_wars|E], much of the surrounding town could yet be reclaimed. \n\nRestoring these remnants would greatly hasten the resettlement of this corner of [arnor|E], but the effort will demand no small sum of gold. What course shall I choose?"
 wastelands_custom.002.a: "No expense is too great to rebuild Arnor."
 wastelands_custom.002.b: "I can spare some gold."
 wastelands_custom.002.c: "There is surrely riches to be found within..."

 wastelands_custom.003.t: "[obstacle_province.GetName]: Artifacts of Arnor"
 wastelands_custom.003.desc: "As my settlers continue to work on establishing their settlements within [obstacle_province.GetName], they uncover a hidden cache of ancient artifacts within some of the ruins left behind by [arnor|E].\n\nThe artifacts are adorned with the craftsmanship of the [dunedain|E] of [arnor|E], bearing symbols and designs that hint at their old purpose and quality. The settlers believe these artifacts are rightfully theirs and should remain in their possession. Yet their worth, both historical and material, is far too great to be entrusted to common hands."
 wastelands_custom.003.a: "Study the artifacts closely."
 wastelands_custom.003.a.success.toast.t: "The artifacts are deciphered and studied"
 wastelands_custom.003.a.failure.toast.t: "The knowledge is beyond your reach"
 wastelands_custom.003.a.duel_success: "You discover ancient lore"
 wastelands_custom.003.a.duel_failure: "There are unforeseen consequences"
 wastelands_custom.003.b: "Allow the colonists to keep their treasure."
 wastelands_custom.003.c: "These items are Arnor's history, and thus must be kept safe."
 wastelands_custom.003.c.success.toast.t: "The artifacts are collected"

 ##Bozisha Dar Trib Event Chain 
 pharazain_events.4.t: "Envoys to Bôzisha-Dâr"
 pharazain_events.4.desc: "Having left earlier this morning, a company of envoys has departed the capital and is now en route to Bôzisha-Dâr. They carry a message of the utmost importance, one that could bring my people great riches or the scourge of war. It will take them a few weeks to reach the Grand Porte, and there they will present my words to [bozisha_dar_holder.GetName]. Only then will I have an answer to my demands.\n\nMy terms are simple: Bôzisha-Dâr and all of [ray|E] must bend the knee and accept me as their [suzerain|E], as was agreed in the days of ancient [numenor|E]. If [bozisha_dar_holder.GetSheHe] consents, peace and prosperity will follow. If [bozisha_dar_holder.GetName] refuses, they will be answered with force."
 pharazain_events.4.a: "The Envoys are off, now to only wait."

 pharazain_events.5.t: "An Unthinkable Demand"
 pharazain_events.5.desc: "A procession of envoys from [GetTitleByKey('e_pharazain').GetNameNoTier] arrived in Bôzisha-Dâr today. After the diplomats’ formal greeting they produced the demands of [pharazain_holder.GetName]: 'Bôzisha-Dâr and all of [ray|E] must bend the knee and accept me as their [suzerain|E], as was agreed in the days of ancient [numenor|E].'\n\nImmediately the court erupted into chaos. Some lords cried that these invaders should be driven out like dogs, others called for the mustering of troops to defend our honor, still others sank into despair. Above all, a cold dread settled over my court as everyone grasped the truth. The [GetTitleByKey('e_pharazain').GetName] is far more powerful than we, and our chances of holding back their legions are slim. All eyes turn to me for guidance. What shall be my course of action?"
 pharazain_events.5.a: "We must yield, [pharazain_holder.GetFirstName] is far too powerful."
 pharazain_events.5.b: "Our independence is not up to debate, refuse all demands!"

 pharazain_events.6.t: "Demands Accepted"
 pharazain_events.6.desc: "Joyous news! [bozisha_dar_holder.GetName] has yielded to our demands and now stands as our loyal [tributary|E]. Already my coffers grow heavy with the first shipments of tribute from [ray|E], the first of many more to come.\n\nYet the true treasure lies not in gold alone. By submitting, [ray|E] has affirmed that the oaths and treaties once sworn to [numenor|E] extend to us as their rightful heirs. This recognition strengthens the foundations of [GetTitleByKey('e_pharazain').GetNameNoTier], bolstering our internal stability, our pride, and our standing among the realms of the world. \n\nToday, the first stone has been set in the grand work of restoring the [adunai|E]’s rightful dominion."
 pharazain_events.6.a: "With this, our claim as the Heirs of [numenor|E] stands beyond dispute."

 pharazain_events.7.t: "Demands Refused"
 pharazain_events.7.desc: "Devastating news has arrived from Bôzisha-Dâr. [bozisha_dar_holder.GetName] has flatly refused your demands. Their official reply lambasted you for invoking a millennia‑old agreement in the present day and branded you a warmongering madman for making such outrageous claims. If [bozisha_dar_holder.GetName] is to be made our tributary now, it can only be by the sword.\n\nThe loss of the expected income from [ray|E] is grievous for [GetTitleByKey('e_pharazain').GetNameNoTier], but a greater blow has been struck at our legitimacy. In a single, chilling dispatch the notion that [GetTitleByKey('e_pharazain').GetNameNoTier] are the rightful heirs of [numenor|E] has been shattered. Where we were once greeted with respect, we are now met with suspicion and cold faces. Restoring our reputation and prestige may take months or years.\n\nNow the question remains: shall we fulfil our vow and take up arms against Bôzisha-Dâr?"
 pharazain_events.7.a: "How dare they! Muster the banners!"
 pharazain_events.7.b: "War isn't worth it, abandon the effort."

 #Sindar Names

 gondor.9011.t: "A Name of Royal Bearing"
 gondor.9011.desc: "Which name will I choose?"
 gondor.9011.a: "Míriel"
 gondor.9011.a.tt: "Míriel, daughter of King Tar-Palantir, and the rightful heir of Númenor. When Númenor sank, Míriel attempted to ascend Meneltarma and save Númenor, but she drowned before reaching the summit. A tragic hero who almost saved Númenor"
 gondor.9011.aa: "Silmariën"
 gondor.9011.aa.tt: "Silmariën, the progenitor of the line of the Lords of Andúnië, from which the Kings of Gondor and Arnor later sprung, and oldest child of King Tar-Elendil. The Mother of the Line of Kings."
 gondor.9011.b: "Ancalimë"
 gondor.9011.b.tt: "Ancalimë, 'Most bright', the first Ruling Queen of Númenor. If not for her, Númenórean Queenship would never have been attempted."
 gondor.9011.c: "Telperiën"
 gondor.9011.c.tt: "Telperiën, named after Telperion, the Silver Tree of Valinor, the 10th ruler and second Ruling Queen of Númenor. A woman who's rule was prosperous."
 gondor.9011.d: "Vanimeldë"
 gondor.9011.d.tt: "Vanimeldë, 'Beautiful Beloved', was the sixteenth ruler of Númenor and its third Ruling Queen. Her reign stands among the last faithful and flourishing chapters in the island’s storied history."
 gondor.9011.e: "Next Page"
 
 gondor.9022.t: "A Name of Royal Bearing"
 gondor.9022.desc: "Which name will I choose?"
 gondor.9022.a: "Fíriel"
 gondor.9022.a.tt: "Fíriel of Arthedain, daughter and only surviving child of King Ondoher. From her the Line of Isildur continued, and became the Dúnedain Rangers in the wilds of Eriador."
 gondor.9022.b: "Lúthien"
 gondor.9022.b.tt: "Lúthien, famous from her romance with Beren, and subject of one of the great stories of the Elder Days. Her story was told for many ages to come, and it was said her bloodline will never perish."
 gondor.9022.c: "Haleth"
 gondor.9022.c.tt: "Haleth, leader of the Haladin in Eldar Days, lead her people through strife and hardship, and gave them peace on the other side. She gave birth to the House of Haleth who would later take part in the founding of Númenor."
 gondor.9022.d: "Berúthiel"
 gondor.9022.d.tt: "Berúthiel, Queen of Gondor, and the subject of many intriguing stories. She was noted for being 'nefarious, solitary, and loveless' and wearing plain black and silver garments."
 gondor.9022.e: "None of these suit me."
 

 ##Change Capital Loc

 decision_new_capital.tt.new_capital_nykkea: "[GetTitleByKey('c_nykkea').GetNameNoTier]" 
 new_capital_nykkea_tooltip: "For centuries, the Shipyards of Nykkea have constructed many great naval vessels, which have been used for anything from Privateering to trade. Even with the city's founding being after the [akallabeth|E], the city has much [numenorean|E] heritage from the many waves of Adûnâic settlers in the region. The city's prosperity seems to grow daily as countless lords need endless ships."

 decision_new_capital.tt.new_capital_ciryandur: "[GetTitleByKey('c_hazaj_tollin').GetNameNoTier]" 
 new_capital_ciryandur_tooltip: "Hazaj Tollin, previously known as Ciryandur, is one of if not the oldest [numenorean|E] settlements in [bellakar|E]. With the Arch at its gate, this city shows great potential."

 decision_new_capital.tt.new_capital_urezayan: "[GetTitleByKey('c_urezayan').GetNameNoTier]" 
 new_capital_urezayan_tooltip: "Ûrêzâyaneth was, and still is, the great jewel of the [bellakari|E] coast. Its pillared eagle ever facing west, remembering the days of [numenorean|E] plenty and indulgence, and the devastation that followed."

 decision_new_capital.tt.new_capital_inzilloni: "[GetTitleByKey('c_inzilloni').GetNameNoTier]" 
 new_capital_inzilloni_tooltip: "The merchant fleets of Inzillôni are rich and powerful, sailing to as far as [gondor|E] to make their plenty. A truly [adunaic|E] city, a proud mercantile culture has blossomed here in [thanihazad|E]."

 decision_new_capital.tt.new_capital_mispir: "[GetTitleByKey('c_mispir').GetNameNoTier]" 
 new_capital_mispir_tooltip: "Mispír, the home of the [balan_lai|E], and the center of diplomacy and vice in [thanihazad|E]. If any single city were to be named the capital of [thanihazad|E], it would be Mispír."

 decision_new_capital.tt.new_capital_uruloni: "[GetTitleByKey('c_uruloni').GetNameNoTier]" 
 new_capital_uruloni_tooltip: "Ûrulôni is an old and great city. Overlooking the lower suburb of Ûrulômik, Ûrulôni is truly of [numenorean|E] make, emulating the old architecture of Ondostar."

