 #Separatism Events
 pharazain_events.9.t: "Despair and Rebelion"
 pharazain_events.9.desc: "Last night, while the rest of [GetTitleByKey('e_pharazain').GetNameNoTier] slept, a single spark of rebellion ignited the powderkeg that had long been smoldering. By dawn, countless cities across the realm had descended into chaos, as commoners and traitors rose against those still loyal to the crown. \n\nA simmering hatred for [GetTitleByKey('e_pharazain').GetNameNoTier] had quietly taken root in the hearts of many of your people, largely unbeknownst to the nobles of [GetTitleByKey('e_pharazain').GetNameNoTier]. They saw the Golden Dominion not as a protector or unifier, but as a foreign force imposing its power over their lives. \n\nYou awoke to find your proud kingdom ablaze, anarchy and revolt spreading unchecked through every province beyond your core strongholds. The royal court lies in disarray, the army is overstretched and disorganized, governance has all but collapsed, and tax collectors are slain before they can even reach their posts. The realm itself teeters on the brink, no longer functioning as a kingdom should.\n\n#V The [GetTitleByKey('e_pharazain').GetNameNoTier] Civil War has begun.#!"
 pharazain_events.9.a: "How could this happen..."

 pharazain_events.10.t: "Vassal Joins Rebelion"
 pharazain_events.10.desc: "The fires of separatism continue to sweep across my lands, and ever more provinces have fallen under the rebellion’s sway. A corner of the realm that was once untouched now rises in open revolt! [leader_of_rebellion.GetName] has levied his forces, joining the rebellion and declaring his independence from the realm. [leader_of_rebellion.GetFirstName] has toppled our loyalists and stand ready to fight for independence. \n\nThey must be crushed at all costs, the very future of [GetTitleByKey('e_pharazain').GetNameNoTier] depends on it."
 pharazain_events.10.a: "How many rebellions can there be?"

 pharazain_events.11.t: "A Bloody Calm"
 pharazain_events.11.desc: "At last, after years of bloodshed and unending rebellion, the [GetTitleByKey('e_pharazain').GetNameNoTier] Civil War has come to an end. Countless lie dead across the realm. Many vassals, traitor and loyal alike, fell in the unending fields of battle. The hordes of rebels and separatists have bled out their last, and none now dare oppose your victorious armies. Some claim the wounds are too deep to heal, that even as the embers cool [GetTitleByKey('e_pharazain').GetNameNoTier] is fated to a slow, humiliating decline. \n\nThey will be proven wrong. With this long-awaited peace we can finally turn to rebuilding the realm and reforming our administration. Doubters will be silenced by deeds. [GetTitleByKey('e_pharazain').GetNameNoTier] will endure, triumphant, whatever trials remain."
 pharazain_events.11.a: "There is much work to be done."

 pharazain_events.12.t: "The Final Consolidation of the Realm"
 pharazain_events.12.desc: "After many long years, the provinces of [GetTitleByKey('e_pharazain').GetNameNoTier] have at last been fully integrated into the realm’s administration. Where once the disparate corners of our dominion acted with near-total autonomy and with little regard for central authority, now each province adheres firmly to the rule of the crown. \n\nNew seats of bureaucracy oversee the governance of the land, while loyal vassals ensure that the word of [ROOT.GetCharacter.GetTitledFirstName] carries to every corner of the realm. There is no rebellion, no unrest, only order, law, and the unshakable rule of our [ROOT.GetCharacter.GetLadyLord]."
 pharazain_events.12.a: "All hail our [ROOT.GetCharacter.GetName]!"

 pharazain_events.13.t: "The Reformation of the Administration"
 pharazain_events.13.desc: "The [GetTitleByKey('e_pharazain').GetNameNoTier] Civil War exposed the many flaws in our administration and revealed just how devastating they were to the realm. A lack of central control allowed those on the fringes of governance to pocket funds meant for the crown. Unruly commoners and traitors carried out their schemes without our knowledge, while levies and soldiers were withheld from the Gilded Sovereign. Rebellion and treason festered beneath our very noses, and we were blind to it!\n\nThrough decades of effort, these failures of the past have been addressed. The capabilities and resilience of our bureaucracy are now stronger than those of any other realm in the [thirdage|E].\n\nYet many within the realm believe even more must be done. These voices fall into two camps, some call for a kingdom of strict law and order, where all are bound by the law and the administration wields the greatest authority. Others argue that the power of the Gilded Sovereign must be strengthened further still, leaving no room for rebellion and ensuring the crown holds all the cards. \n\nWhich path shall you choose?"
 pharazain_events.13.a: "A Realm of Law"
 pharazain_events.13.b: "A Realm of Power"
 once_done_you_get_buffed_admin_tt: "You gain the [GetModifier('lotr_admin_into_admin_character_modifier').GetNameWithTooltip] [modifier|E] for #V 10 years#!.\n\nAfter this period, your realm will adopt an [administrative_government|E] and your culture will unlock the unique #V $innovation_adunai_administration_admin$#! [innovation|E].\n\n[domain_limit|E]: #P +1#!\n[army|E] Gold Maintenance: @gold_icon! #N +50.00%#!\nSize of [men_at_arms|E] [regiments|E]: #P +2#!\nMax number of [men_at_arms|E] [regiments|E] #P +1#!"
 once_done_you_get_buffed_feudal_tt: "You gain the [GetModifier('lotr_admin_into_faudal_character_modifier').GetNameWithTooltip] [modifier|E] for #V 10 years#!.\n\nAfter this period, your realm will reform your [feudal_government|E] and your culture will unlock the unique #V $innovation_adunai_administration_feudal$#! [innovation|E].\n\n[domain_limit|E]: #P +1#!\n[vassal_limit|E] #P +60#!\n[vassal|E] [tax|E] [contribution|E]: @gold_icon! #P +10%#!\n[vassal|E] [levy|E] [contribution|E]: @soldier_icon! #P +10%#!"

 pharazain_events.14.t: "The Reforms of [ROOT.GetCharacter.GetTitledFirstName]"
 pharazain_events.14.desc: "After decades of civil war, followed by years of relentless reform and political upheaval, the storm has at last subsided. The Golden Dominion now enters an age of peace and prosperity. The reforms of [ROOT.GetCharacter.GetName] have taken firm root, and [GetTitleByKey('e_pharazain').GetNameNoTier] stands united under the order of a new [administrative_government|E]. Never again shall unruly [feudal|E] politics unsettle our realm, for law and the authority of the central government now hold sway.\n\nFrom the great cities of [bellakar|E], to the fertile fields of Kharadûnê, and the vast wealth of [thanihazad|E] and [anbalkumagan|E], the [GetTitleByKey('e_pharazain').GetName] has secured and cemented its rule. No longer can any doubt remain, these lands and their peoples are, beyond all question, Pharazâini."
 pharazain_events.14.a: "May the power of law be absolute"

 pharazain_events.15.t: "The Reforms of [ROOT.GetCharacter.GetTitledFirstName]"
 pharazain_events.15.desc: "After decades of civil war, followed by years of relentless reform and political upheaval, the storm has at last subsided. The Golden Dominion now enters an age of peace and prosperity. The reforms of [ROOT.GetCharacter.GetName] have taken firm root, and [GetTitleByKey('e_pharazain').GetNameNoTier] stands united under the order of a newly reformed [feudal_government|E]. Never again shall unruly [vassals|E] rend this kingdom asunder, for the authority of the [ROOT.GetCharacter.GetLadyLord] is absolute and shall never again be challenged.\n\nFrom the great cities of [bellakar|E], to the fertile fields of Kharadûnê, and the vast wealth of [thanihazad|E] and [anbalkumagan|E], the [GetTitleByKey('e_pharazain').GetName] has secured and cemented its rule. No longer can any doubt remain, these lands and their peoples are, beyond all question, Pharazâini."
 pharazain_events.15.a: "May the power of the Gilded Sovereign be absolute"

 pharazain_events.16.t: "The [GetTitleByKey('e_pharazain').GetNameNoTier] Civil War"
 pharazain_events.16.desc: "The newly proclaimed [GetTitleByKey('e_pharazain').GetName] has been plunged into anarchy, as its freshly conquered territories rise in defiance against the crown. The great realm now buckles beneath the weight of internal strife, its authority crumbling on every frontier. Pharazâin’s hold over its own heartlands is fragile at best, while vast stretches of the dominion stand in open rebellion against the Golden Throne."
 pharazain_events.16.a: "So young, yet already tearing itself apart."

