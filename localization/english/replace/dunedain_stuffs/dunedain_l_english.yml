 #Administration
 decision_pharazain_reform_administration: "Reform Administration"
 decision_pharazain_reform_administration_desc: "The chaos of the [GetTitleByKey('e_pharazain').GetNameNoTier] Civil War has exposed the many glaring flaws within our overextended administration. Our military is overstretched and disorganized, our borders lie exposed, and internal strife has long been neglected. Control over our own heartlands has been ignored in favor of holding together the far reaches of the realm and appeasing unruly vassals. Meanwhile, our tax base, underfunded, ill-equipped, and riddled with corruption, has drawn the ire of the people and cost us much-needed revenue.\n\nWith the fires of war still raging, this catastrophe has left our already fractured nation even less able to face the growing threats that surround it. In the crucible of civil war, we must reforge our broken administration and build a new governing apparatus. One that will serve the Golden Dominion faithfully and ensure the efficient and orderly running of the state."
