 #MAA localization
 dunedain_marines: "Dúnedain Marines"
 dunedain_marines_flavor: "Armed with bows, swords, and boarding axes, these lightly armored soldiers are accustomed to fighting against corsairs and all other manners of threats on the sea."
 dunedain_reformed_rangers: "Dúnedain Rangers"
 dunedain_reformed_rangers_flavor: "Grim in appearance and clad in grey and dark green, the Rangers of the [westlands|E] fight against the world's evils, even as others would falter and flee."
 dunedain_reformed_wardens: "Dúnedain Wardens"
 dunedain_reformed_wardens_flavor: "With spear and shield in hand, these rangers keep foes at bay while their bow-wielding brethren deal the killing strike."
 dunedain_reformed_outriders: "Dúnedain Outriders"
 dunedain_reformed_outriders_flavor: "Speed is required to patrol the vast lands of the [westlands|E]. These [dunedain|E] are well suited to long and arduous journeys, with only their mounts for company."
 dunedain_steelbow: "Dúnedain Steelbowmen"
 dunedain_steelbow_flavor: "With all wielding the steel-bows of their forefathers, the Dúnedain unleash a hail of steel."

 adunaic_skirmishers: "Nadêphalnardû"
 adunaic_skirmishers_flavor: "The 'Flanking Speermen' of the Adûnâi, the Nadêphalnardû are armed with spears and medium sized shields. These lightly armored [adunaic|E] soldiers are accustomed to flanking their enemies, and crushing them with their superior mobility."
 adunaic_soldiers: "Nardûpharazzôr "
 adunaic_soldiers_flavor: "The 'Soldiers of the Golden Flame', the Nardûpharazzôr fight with grim determination. Learned of the long and storied history of the [adunai|E], they fight knowing what is at stake. Strong-willed, they are willing to do whatever is needed to ensure the [adunai|E] continue far into the [fourthage|E] strong and undefeated."
 adunaic_elites: "Adûnakhôri"
 adunaic_elites_flavor: "The 'Lords of the West', the Adûnakhôri have flowing through their veins some of the purest [bloodofnumenor|E] left in all of [middleearth|E]. With the pride and glory of their ancient [numenorean|E] ancestors, the Adûnakhôri will carry on their back the future of the [adunai|E], and the legacy of [numenor|E]."
 adunaic_spearmen: "Pharaztud"
 adunaic_spearmen_flavor: "The 'Golden Watch', the Pharaztud are some of the preeminent soldiers in [middleearth|E]. Professional spearmen, disciplined and with unbreakable moral, they will fight to the very last. These [adunai|E] are the backbone of the Pharazani army and have secured many victories."
 adunic_steelbowmen: "Khôrankalûtai"
 adunic_steelbowmen_flavor: "The 'Lords of the Steelbow', the Khôrankalûtai fight with the heralded [numenorean|E] Steelbow. Each of these bowmen is more skilled than any other, and even the most heavily armored opponents fall to the power of just one arrow. Drilled day and night, the Khôrankalûtai are more skilled than many [elves|E]."
 knights_of_the_adunai: "Gimilzagar-an-Êru"
 knights_of_the_adunai_flavor: "The 'Silver Swords of Êru', are the elite Knights of the [adunai|E]. Proud of their pure [numenorean|E] blood, these knights come from fair and noble houses that can trace their lineage as far back as [numenor|E] itself! No foe could hope to cross with the Silver Swords and live till the next dawn."
 
 numenorean_marines: "Airëheru"
 numenorean_marines_flavor: "The 'Sea Lords', bear weapons wrought with spells of power. They are armed with bows, swords, and boarding axes. These [numenorean|E] soldiers are accustomed to fighting against all manners of threats on the sea."
 numenorean_reformed_outriders: "Calaquentur"
 numenorean_reformed_outriders_flavor: "The 'Light Horselords', bear weapons wrought with spells of power. Speed is required to patrol the vast lands of [middleearth|E]. These [numenorean|E] soldiers are well suited to long and arduous journeys, with only their mounts for company."
 numenorean_pikemen: "Cundohatal "
 numenorean_pikemen_flavor: "The 'Spear Lords', are the pikemen of [numenor|E], bearing heavy armour and spears wrought with spells of power. They are the wall of [numenor|E], who protect those behind them at any personal cost. These [numenoreans|E] are the backbone of the army and have secured many victories."
 numenorean_soldiers_custom: "Túranúohtar"
 numenorean_soldiers_custom_flavor: "The 'Great Soldiers of the West', bear heavy armour and swords wrought with spells of power. Strong-willed, they are willing to do whatever is needed to ensure the [numenoreans|E] continue far into the [fourthage|E] strong and undefeated."
 numenorean_archers_custom: "Erëquingatur"
 numenorean_archers_custom_flavor: "The 'Lords of the Steelbow', are the archers of [numenor|E] bearing the legendary steel great-bows, with range and power unparalleled among [men|e]. Even the most heavily armored opponents fall to the power of just one arrow. Drilled day and night, the Erëquingatur are more skilled than many [elves|E]."
 numenorean_elites_custom: "Tirnúmentur"
 numenorean_elites_custom_flavor: "The 'Watch of the Western Lords', are the elite guard of [numenor|E], bearing heavy armour and swords wrought with spells of power. Made by the finest smiths known to [man|E], their arms and armor are some of the finest seen since the [firstage|E], only surpassed by their bearers virtue."
 numenorean_knights_custom: "Númenarquen"
 numenorean_knights_custom_flavor: "The 'Knights of the West', bear heavy armour, well-bred horses, and weapons wrought with spells of power. Proud of their pure [numenorean|E] blood, these knights come from fair and noble houses. No foe could hope to cross with the Númenarquen and live till the next dawn."

 numenorean_marines_adunaic: "Arazrakhôri"
 numenorean_marines_adunaic_flavor: "The 'Kingly Sea Lords' bear weapons wrought with spells of power. They are armed with bows, swords, and boarding axes. These [numenorean|E] soldiers are accustomed to fighting against all manners of threats on the sea."
 numenorean_reformed_outriders_adunaic: "Arkarabkhôri"
 numenorean_reformed_outriders_adunaic_flavor: "The 'Kingly Horse lords' bear weapons wrought with spells of power. Speed is required to patrol the vast lands of [middleearth|E]. These [numenorean|E] soldiers are well suited to long and arduous journeys, with only their mounts for company."
 numenorean_pikemen_adunaic: "Arpharaztud "
 numenorean_pikemen_adunaic_flavor: "The 'Kingly Golden Watch' are the pikemen of [numenor|E], bearing heavy armour and spears wrought with spells of power. They are the wall of [numenor|E], who protect those behind them at any personal cost. These [numenoreans|E] are the backbone of the army and have secured many victories."
 numenorean_soldiers_adunaic: "Arnardûpharazôr"
 numenorean_soldiers_adunaic_flavor: "The 'Kingly Soldiers of the Golden Flame' bear heavy armour and swords wrought with spells of power. Strong-willed, they are willing to do whatever is needed to ensure the [numenoreans|E] continue far into the [fourthage|E] strong and undefeated."
 numenorean_archers_adunaic: "Arkhôrankalûtai"
 numenorean_archers_adunaic_flavor: "The 'Kingly Lords of the Steelbow' are the archers of [numenor|E] bearing the legendary steel great-bows, with range and power unparalleled among [men|e]. Even the most heavily armored opponents fall to the power of just one arrow. Drilled day and night, the Erëquingatur are more skilled than many [elves|E]."
 numenorean_elites_adunaic: "Aradûnakhôri"
 numenorean_elites_adunaic_flavor: "The 'Kingly Lords of the West' are the elite guard of [numenor|E], bearing heavy armour and swords wrought with spells of power. Made by the finest smiths known to [man|E], their arms and armor are some of the finest seen since the [firstage|E], only surpassed by their bearers virtue."
 numenorean_knights_adunaic: "Argimilzagar-an-Êru"
 numenorean_knights_adunaic_flavor: "The 'Kingly Silver Swords of Êru', bear heavy armour, well-bred horses, and weapons wrought with spells of power. Proud of their pure [numenorean|E] blood, these knights come from fair and noble houses. No foe could hope to cross with the Argimilzagar-an-Êru and live till the next dawn."

 azul_an_zagar: "Azûl an-Zagar"
 azul_an_zagar_flavor: "The Sea Swords are the elite marines of the [numenorean|E] Eastern Fleet. Though [numenor|E] has long since fallen beneath the waves, her mariners endure, still guarding that which has ever belonged to [westernesse|E], the Sea."

 ephalnardu: "Êphalnardû"
 ephalnardu_flavor: "In the waning days of the [secondage|E], the Far Soldiers of the Eastern Fleet were often drawn from the outspoken [faithful|E] or those considered troublemakers by the Lords of [numenor|E]. Cast out to the furthest outposts, they became men of iron will and hardened bodies, able to endure any storm or typhoon, as they do even to this day."


 ##Decisions
 decision_solidify_pharazain: "Solidify the Golden Dominion"
 decision_solidify_pharazain_desc: "Despite our proclamation of [GetTitleByKey('e_pharazain').GetNameNoTier], our lack of control over the entirety of the [adunai|E] kingdoms, primarily [umbar|E], have had some look askance at our claim to be lords of a true Kingdom of all the [adunaic|E] peoples. We could put these doubts to rest by securing our control over the lands of both [GetGeographicalRegion('special_pharazain').GetName] and the [GetTitleByKey('e_umbar').GetName], we could finally quell any remaining regionalism and permanently solidify the [GetTitleByKey('e_pharazain').GetName] as one entity."
 decision_solidify_pharazain_tooltip: "The homelands of the Adûnâi shall never again be sundered!"
 decision_solidify_pharazain_confirm: "The homelands of the Adûnâi shall never again be sundered!"

 decision_unify_adunai: "Restore a Unified Adûnâic Identity"
 decision_unify_adunai_desc: "Since the [akallabeth|E] sundered the many colonies of [numenor|E], the different realms of our forefathers split apart and developed wildly different cultures. From [umbar|E] and the ever vengeful [kingsmen|E], [bellakar|E] and their egalitarian [faithful|E], [anbalkumagan|E] and their endless depravity, and [thanihazad|E] and the machinations of the [balan_lai|E]. All have developed their own distinct cultures, shaped by their long histories and the many trials and outside influences they have faced. Yet all have ever been fundamentally kingdoms of the [adunai|E], and proud of their high heritage. With the proclamation and solidification of [GetTitleByKey('e_pharazain').GetNameNoTier], the boundaries which once divided the [adunai|E] have fallen, and our people for the first time since the golden age of [numenor|E] have been united beneath a single crown. It will require much work to bring cultures long sundered under one roof once more, but given time and effort, even the diversity of the [adunaic|E] peoples might once more be made one."
 decision_unify_adunai_tooltip: "We are the [adunai|E]."
 decision_unify_adunai_confirm: "We are the Adûnâi."
 decision_unify_pharazaini_get_innovations: "The [pharazaini_culture_culture.GetName] [culture|E] gains all [black_numenorean|E] and [adunaic|E] [innovations|E]"
 decision_unify_pharazaini_characters_custom: "All Northern Adûnâic, Southern Adûnâic, and non-Bellanarûd Bellakari [heritage|E] [characters|e]"
 decision_unify_pharazaini_county_custom: "All Northern Adûnâic, Southern Adûnâic, and non-Bellanarûd Bellakari [heritage|E] [counties|e]"
 decision_unify_adunai_own_all_aduanic_provinces: "You must own all Northern Adûnâic, Southern Adûnâic, and non-Bellanarûd Bellakari [heritage|E] [counties|e] in the [GetGeographicalRegion('special_nie_extra').GetName] [region|E]"
 special_nie_extra: "Greater [numenorean|E] Colonies"
 custom_arnor_minus_shire: "the [arnorian|E] Heartlands"
 middleearth_west_gondor_anorien_minus_druadan: "Anórien"

 decision_reunify_numenor_culture: "Restore a Númenórean Identity"
 decision_reunify_numenor_culture_desc: "Ever since the [akallabeth|E], and the shattering of the Númenórean colonial empire, the former [numenoreans|E] of [middleearth|E] have diverged. Separated by politics, religion, conflict, and sheer distance, the many Sons of [numenor|E] have long been divided. Now, with all of the old Númenórean Colonies under our rule, and the formation of Númenor-in-Exile, the Númenóreans are once again united!"
 decision_reunify_numenor_culture_tooltip: "We are the [numenorean|E]."
 decision_reunify_numenor_culture_confirm: "We are the Númenórean."

 renovate_special_building_arminalethor: "Renovate [GetTitleByKey('b_tol_uialgaer').GetNameNoTier]"
 renovate_special_building_arminalethor_desc: "The islands of [GetTitleByKey('b_tol_uialgaer').GetNameNoTier] has long been inhabited by [numenoreans|E]. Since before the [akallabeth|E], these islands have been sacred to worshipers of [ulmocharacter|E], who believed that they were created by the great [valargods|E] himself. However, for many long years, the islands have been occupied by servants of the Enemy, the [kingsmen|E]. Their beauty and splendor wasted on those who didn't appreciate their value. \nSince we took these islands, many minds have wondered what we could do with such a beautiful land of farms, sand, and sea. Singular is the idea that stands out from all the rest: to build a city in the memory of [armenelos|E] on the island's white sand beaches. Often it's been said that these Sacred Islands have emanated the memory of [numenor|E], and now we shall make those words a reality, by forging from nothing a city whose ancestor would be proud."
 renovate_special_building_arminalethor_tooltip: "Renovate the [GetTitleByKey('b_tol_uialgaer').GetName]"
 renovate_special_building_arminalethor_confirm: "The splendor of [numenor|E] shall be reborn here in [middleearth|E]"
 renovate_special_building_arminalethor_effect_message: "We will decide how much we wish to invest into building the great city of [GetBuilding('wonder_anonarmenlos_01').GetName]"

 decision_reunify_numenor_culture_adunaic_get_innovations: "The [new_numenorean_adunaic_culture.GetName] [culture|E] gains all [arnorian_culture.GetName], [gondorian_culture.GetName], [dunedain_culture.GetName], [pharazaini_culture_culture.GetName], [black_numenorean_culture.GetName], [umbarean_culture.GetName], [mardrukan_culture.GetName], [felayan_culture.GetName], [bellakarani_culture.GetName], [bellakaze_culture.GetName], [anbalukkhori_culture.GetName], [kharadunaim_culture.GetName], and [numenorean_culture.GetName] [innovations|E]"
 decision_reunify_numenor_culture_get_innovations: "The [new_numenorean_culture.GetName] [culture|E] gains all [arnorian_culture.GetName], [gondorian_culture.GetName], [dunedain_culture.GetName], [black_numenorean_culture.GetName], [umbarean_culture.GetName], [mardrukan_culture.GetName], [felayan_culture.GetName], [bellakarani_culture.GetName], [bellakaze_culture.GetName], [anbalukkhori_culture.GetName], and [numenorean_culture.GetName] [innovations|E]"
 decision_reunify_numenor_culture_vassals_custom: "All Númenórean-decedent [characters|e] convert to #P Cîr Númenórean#!"
 decision_reunify_numenor_culture_counties_custom: "All Númenórean-decedent [counties|e]"
 decision_reunify_numenor_culture_vassals_custom_a: "All Númenórean-decedent [characters|e] convert to #P Adûnâhin#!"
 decision_reunify_numenor_culture_counties_custom_a: "All Númenórean-decedent [counties|e]"
 decision_gain_numenor_blood_culture_self: "You will become #P Númenórean#!, and gain the max level [bloodofnumenor|E] trait!"
 decision_gain_numenor_blood_culture: "All Númenórean-decedent [characters|e] become #P Númenórean#!, and gain four levels of the [bloodofnumenor|E] trait!"
 decision_gain_numenor_blood_culture_lesser: "All Númenórean-decedent [characters|e] become #P Númenórean#!, and gain two levels of the [bloodofnumenor|E] trait!"
 decision_gain_numenor_blood_culture_none: "All Númenórean-decedent [characters|e] become #P Númenórean#!"

 decision_unify_southern_adunai: "Restore a Southern Adûnâic Identity"
 decision_unify_southern_adunai_desc: "Ever since the [akallabeth|E], and the shattering of the Númenórean colonial empire, the [numenoreans|E] of the former Southern Colonies have diverged. The north in the more populated heartland of [anbalkumagan|E] has fallen into depravity and pride, being some of the most wicked [men|E] to exist in the [thirdage|E]. The [numenoreans|E] of the south in the much more sparsely settled [thanihazad|E] have developed a much less degenerate culture, one much more founded on the original principles of [numenor|E]. United as one people before the [downfall|E], they can be one once more!"
 decision_unify_southern_adunai_tooltip: "We are the Kharatakhôri."
 decision_unify_southern_adunai_confirm: "We are the Kharatakhôri."
 decision_unify_south_adunai_get_innovations: "The [kharatakhori_culture.GetName] [culture|E] gains all [anbalukkhori_culture.GetName] and [kharadunaim_culture.GetName] [innovations|E]"
 decision_unify_south_adunai_county_custom: "All Southern Adûnaic Heritage [counties|e]"
 decision_unify_south_adunai_characters_custom: "All Southern Adûnaic Heritage [characters|e]"

 numenor_in_exile_acceptance_tt_custum: "Every Realm [culture|E] sharing the #V [numenorean|E]#! [heritage_group|E] increases their [cultural_acceptance|E] by a mutual #p 40%#!"
 decision_gain_numenorean_soldiers_innovations: "Our [culture|E] will gain Powerful [numenorean|E] [men_at_arms|E]"
 decision_gain_numenor_blood_culture_self_family: "You and your family will strengthen your #P Númenórean Blood#!, and gain one level of the [bloodofnumenor|E] trait!"

 decision_integrate_rohan: "Unify With Rohan"
 decision_integrate_rohan_desc: "[rohan|E] has long stood as a steadfast ally of [gondor|E], riding to our defense time and again. Since the days when Eorl the Young was granted the land of [calenardhon|E] by the Stewards of [gondor|E], the [rohirrim|E] have dwelt and ruled upon the wide, green plains of [rohan|E].\n\nNow, with the shadow of [mordor|E] at last overthrown, the bonds between [rohan|E] and [gondor|E] are stronger than ever before. Yet with a [dunedain|E] now risen to the throne of [rohan|E], voices within [gondor|E] have begun to call for the reclamation of the old province of [calenardhon|E]. Some argue that the land should be taken by the might of our armies, but wiser counsels propose a different path: to invite the ruler of [rohan|E] to join our realm as a vassal."
 decision_integrate_rohan_tooltip: "Rohan will again be Gondorian"
 decision_integrate_rohan_confirm: "[rohan|E] will once again be a land of [gondor|E]"
 rohan_ruler_is_dunedain: "The ruler of [rohan|E] is [dunedain|E]"
 reclaim_calenardhon_dunedain: "We will ask the ruler of [rohan|E] to peacefully join [gondor|E]\nIf they accept [rohan|E] will become your [vassal|E]"

 decision_calenardhon_calemmir_aldburg_claim.tt: "We will meet with [aldburg_holder.GetName] to discuss the future of [GetTitleByKey('c_aldburg').GetNameNoTier]"

 decision_calenardhon_calemmir_special_building: "Restore Calemmanc"
 decision_calenardhon_calemmir_special_building_desc: "The former capital of [calenardhon|E], Calemmanc, now once more stands as the proud heart of the province. Yet the long years under the rule of [rohan|E], and the decline it suffered even before the Ride of Eorl, have left the city a shadow of its former glory. Once-mighty walls and towers lie in partial ruin, lesser works unworthy of the [dunedain|E] have crept in their place, and vast quarters of the city stand abandoned, for there are simply too few souls to fill them.\n\nThis must be set right if we are to preserve our dignity. We shall dispatch a number of [gondorians|E] to repopulate the deserted districts and to labor as builders and engineers, with the steadfast aim of restoring the city to her ancient splendor."
 decision_calenardhon_calemmir_special_building_tooltip: "Calemmanc will again be [dunedain|E]"
 decision_calenardhon_calemmir_special_building_confirm: "The restoration of Calemmanc will bring prosperity to all."
 decision_calenardhon_calemmir_special_building.tt: "We will begin the process of rebuilding [GetTitleByKey('c_aldburg').GetNameNoTier]"
 
 decision_adunaic_revival_mirlond: "Revive Adûnaic Culture in [GetTitleByKey('c_mirlond').GetNameNoTier]"
 decision_adunaic_revival_mirlond_desc: "Long ago, [GetTitleByKey('c_mirlond').GetNameNoTier] was a city of the [adunai|E] and settled by the lords of [westernesse|E]. In the years following the [akallabeth|E], however, the [numenorean|E] legacy in [GetTitleByKey('c_mirlond').GetNameNoTier] waned, gradually supplanted by the native Haruze of [harad|E]. The people of [GetTitleByKey('c_mirlond').GetNameNoTier] must reclaim their ancient [adunaic|E] Heritage, and cast off the lingering shadow of Haruze influence. The time has come to awaken our legacy, to stand proud once more as the [adunai|E] of the North!"
 decision_adunaic_revival_mirlond_tt: "Stand, [adunai|E]!"
 decision_adunaic_revival_mirlond_confirm: "[GetTitleByKey('c_mirlond').GetNameNoTier] is a city of the [adunai|E]"

 decision_adunaic_revival_ramlond: "Revive Adûnaic Culture in [GetTitleByKey('c_ramlond').GetNameNoTier]"
 decision_adunaic_revival_ramlond_desc: "Long ago, [GetTitleByKey('c_ramlond').GetNameNoTier] was a city of the [adunai|E] and settled by the lords of [westernesse|E]. In the years following the [akallabeth|E], however, the [numenorean|E] legacy in [GetTitleByKey('c_ramlond').GetNameNoTier] waned, gradually supplanted by the native Haruze of [harad|E]. The people of [GetTitleByKey('c_ramlond').GetNameNoTier] must reclaim their ancient [adunaic|E] Heritage, and cast off the lingering shadow of Haruze influence. The time has come to awaken our legacy, to stand proud once more as the [adunai|E] of the North!"
 decision_adunaic_revival_ramlond_tt: "Stand, [adunai|E]!"
 decision_adunaic_revival_ramlond_confirm: "[GetTitleByKey('c_ramlond').GetNameNoTier] is a city of the [adunai|E]"

 decision_adunaizization_of_greater_umbar: "Strengthen Adûnaic Culture in [GetTitleByKey('k_umbar').GetNameNoTier]"
 decision_adunaizization_of_greater_umbar_desc: "Since the very beginning of the [thirdage|E], Umbar has been a realm of the [adunai|E]. Through the relentless march of time, through countless wars with [gondor|E] and [harad|E], and even during an age of complete [haradrim|E] domination, the [adunai|E] of Umbar have endured. Yet today, only a small portion of our people identify as truly [adunaic|E]. This must change. We will 'encourage' our people to embrace our way of life, for they are [adunai|E]. \nEven if they do not yet realize it."
 decision_adunaizization_of_greater_umbar_tt: "Stand Tall, [adunai|E]!"
 decision_adunaizization_of_greater_umbar_confirm: "The [GetTitleByKey('k_umbar').GetName] is a realm of the [adunai|E]"

 decision_dunedainization_of_umbar: "Revive Umbaredain Culture"
 decision_dunedainization_of_umbar_desc: "During the reign of the [shipkings|E], Umbar stood proud as a land of the [dunedain|E]. The [black_numenoreans|E] had been subdued, their darkness cast beneath the Light of the [dunedain|E]. But as the strength of [gondor|E] waned, Umbar once more fell into the shadow of the [black_numenoreans|E]. \n\nAfter centuries of bloodshed and hardship, Umbar has at last returned to the hands of the [dunedain|E]. Never again shall it become a bastion of evil. We will encourage the people of Umbar to embrace our way of life, for they, too, are [dunedain|E]. \nEven if they do not yet know it."
 decision_dunedainization_of_umbar_tt: "United with the Southern Haven Once More!"
 decision_dunedainization_of_umbar_confirm: "[GetTitleByKey('k_umbar').GetNameNoTier] is again a realm of the [dunedain|E]"
 decision_all_umbarean_provinces: "You must own all Northern Adûnâic [heritage|E] [counties|e] in the [GetGeographicalRegion('special_nie_extra').GetName] [region|E]"
 decision_convert_umbar_dunedain_umbaredain: "All Northern Adûnâic [heritage|E] [counties|E] will be converted to the #V [umbaredain_culture.GetName]#! [culture|E] and the #V [GetPlayer.GetFaith.GetName]#! [faith|E]"
 decision_convert_umbar_dunedain_dunedain: "All Northern Adûnâic [heritage|E] [counties|E] will be converted to the #V [GetPlayer.GetCulture.GetName]#! [culture|E] and the #V [GetPlayer.GetFaith.GetName]#! [faith|E]"
 decision_convert_umbar_dunedain_umbaredain_modifier: "All Formerly Northern Adûnâic [heritage|E] [counties|E] will gain [GetModifier('lotr_converting_umbaredain_county_modifier').GetNameWithTooltip] for #V 25 years#!"
 decision_convert_umbar_dunedain_gondorian: "All [gondorian|E] [culture|E] [counties|E] in [GetGeographicalRegion('middleearth_harad_near_umbar').GetName] will be converted to the #V [umbaredain_culture.GetName]#! [culture|E]"

 decision_adunaic_revival_tanturak: "Revive Adûnaic Culture in [GetTitleByKey('k_tanturak').GetNameNoTier]"
 decision_adunaic_revival_tanturak_desc: "Tantûrak was once a proud, if depraved, realm of the [adunai|E]. For many long years, the ancient palaces and cities of [numenor|E], hidden within Tantûrak's vast jungles, have stood abandoned and decaying. But no longer! By bringing in colonists from [GetTitleByKey('e_thani_hazad').GetNameNoTier], these lands shall once again become true lands of the [adunai|E]!"
 decision_adunaic_revival_tanturak_tt: "Stand, [adunai|E] of the South!"
 decision_adunaic_revival_tanturak_confirm: "[GetTitleByKey('k_tanturak').GetNameNoTier] is again a realm of the [adunai|E]"
 dunedain_tanturaki_tooltip: "You will be given the option to either:\n  - Convert Yourself, your Family, and your Lands in Tantûrak to #E Tanturaki#!\n  - Convert your lands in Tantûrak to #E Tanturaki#!\n  - Convert your lands in Tantûrak to your current [adunaic|E] Culture"

 decision_east_adunaic_revival: "Revive Adûnaic Culture"
 decision_east_adunaic_revival_desc: "Long ago, Anarike was a colony of ancient [numenor|E], home to the Eastern Fleets and settled by the seafarers of [westernesse|E]. In the years following the [akallabeth|E], however, the [numenorean|E] legacy in Anarike waned, gradually supplanted by the native peoples of Khy. Today, most accept this mingled heritage without question, many with indifference. [numenor|E] lives on only in dusty tomes and half-forgotten lore. \n\nYet in Kadar Abar-narîk and Inyalôni, where echoes of old customs still endure, a rising voice calls out! That the people of Anarike must reclaim their ancient [adunaic|E] Heritage, and cast off the lingering shadow of Khyan influence. The time has come to awaken our legacy, to stand proud once more as the [adunai|E] of the East!"
 decision_east_adunaic_revival_tt: "Stand, Adûnâi of the East!"
 decision_east_adunaic_revival_confirm: "We Shall be Remembered as the Adûnâi of the East"
 decision_east_adunaic_revival_get_innovations: "The [azralai_culture.GetName] [culture|E] gains all [anarikean_culture.GetName] [innovations|E]"

 decision_reintroduce_steelbows: "Reintroduce Steelbows"
 decision_reintroduce_steelbows_desc: "The steel bows of [numenor|E] were the legendary weapons of our [numenorean|E] forefathers, powerful arms said to possess the strength to pierce even the finest armor. Few weapons inspired such fear or respect on the battlefield. The reintroduction of the [numenorean|E] Steelbow would be a formidable addition to our army, greatly enhancing the prowess of our archers.\n\nYet therein lies the challenge: the knowledge of how to forge these mighty bows has been all but lost to time. Only a ruler of exceptional wisdom, vision, and dedication could hope to recover this forgotten craft and restore a weapon worthy of the legacy of old [numenor|E]."
 decision_reintroduce_steelbows_tt: "A Weapon Worthy of [numenor|E]"
 decision_reintroduce_steelbows_confirm: "A Weapon Worthy of [numenor|E]"
 reintroduce_steelbows_tooltip: "Your [culture|E] will gain the improved [GetMaA('dunedain_steelbow').GetName] [men_at_arms|E]"

 decision_move_capital_emyn_arnen_later_take_back: "Will be able to reacquire [GetTitleByKey('c_minas_ithil').GetNameNoTier] through [decision|E] once [GetBuilding('wonder_minas_ithil_03').GetName] has been constructed"

 decision_take_back_minas_ithil: "Reaquire [GetTitleByKey('c_minas_ithil').GetNameNoTier]"
 decision_take_back_minas_ithil_desc: "When the Princely seat was established in Emyn Arnen, the [gondorian|E] Crown entrusted the city of [GetTitleByKey('c_minas_ithil').GetNameNoTier] to the Prince of Ithilien for safekeeping. The Prince was tasked with the arduous duty of cleansing the lingering evils of [minasmorgul|E] from its streets and restoring [minasithil|E] in the purity and memory of the Tower of the Moon. That task is now complete, and the city stands renewed, ready to be returned to the hands of the Crown."
 decision_take_back_minas_ithil_tt: "Reunite the Two Towers"
 decision_take_back_minas_ithil_confirm: "#E [isildur|E]'s#! city will soon be reunited with [minasanor|E]"
 decision_take_back_minas_ithil_tooltip: "#V [THIS.GetCharacter.GetName]#! will gain the #V [GetTitleByKey('c_minas_ithil').GetName]#!"

 decision_bozisha_dar_tributary: "Bôzisha-Dâr's Forgotten Lord"
 decision_bozisha_dar_tributary_desc: "[ray|E] is a land of immense wealth. Linked by land and river to Sîrayn and the Bay of Ormal, nearly all inland trade in the east of [middleearth|E] passes through [ray|E], flowing into its premier city, Bôzisha-Dâr. This has made the city one of the richest in all of [farharad|E].\n\nIn the days of [numenorean|E] dominion, Bôzisha-Dâr and the lords of [ray|E] stood as tributaries to [numenor|E] by law and oath, and much of their riches were rendered unto [westernesse|E], as was their right. But with the [downfallofnumenor|E], central authority collapsed, and Bôzisha-Dâr withheld its wealth from the island now lost to the sea.\n\nNow, as the true Heirs of [numenor|E], we may yet enforce the pact. For it was never formally dissolved, and by law still stands to this day. Should they accept, our prestige and legitimacy would be greatly strengthened. Send envoys to Bôzisha-Dâr at once, and demand they honor their ancient oaths!"
 decision_bozisha_dar_tributary_tooltip: "Bôzisha-Dâr and all of [ray|E] shall remember their pledge"
 decision_bozisha_dar_tributary_confirm: "Bôzisha-Dâr will again be a [tributary|E] of the [adunai|E]"
 decision_bozisha_dar_tributary_tt: "We will dispatch envoys to [GetTitleByKey('c_bozisha_dar').GetNameNoTier] reminding them of their ancient, yet binding pact."

 #Grain Dole
 anbalkumagan_grain_dole_decision: "Reinstate the Pharaz an-Dâira"
 anbalkumagan_grain_dole_decision_desc: "In the years before the [downfallofnumenor|E], [ciryatanore|E] served as the great breadbasket of the [numenorean|E] empire, yielding vast harvests of grain to sustain the island. In those days, the people of [numenor|E] partook of the Pharaz an-Dâira, the 'Gold of the Earth': the regular distributions of free or price-controlled bread. This noble tradition was cast aside when the worship of the [valargods|E] was outlawed, and it perished altogether in the [akallabeth|E]. Yet it is remembered still, and any ruler bold enough to restore it would surely win the hearts of the common folk."
 anbalkumagan_grain_dole_decision_tooltip: "Introduce bread distributions to the people of the capital"
 anbalkumagan_grain_dole_decision_confirm: "Open the granaries!"
 enough_granaries_in_anbalkumagan: "At least 3 counties in the region of [GetGeographicalRegion('custom_anbalkumagan').GetName] have built [GetBuilding('cereal_fields_05').GetName] or higher"
