 pharazain_events.8.t: "The Pharaz an-Dâira"
 pharazain_events.8.desc: "The people have every reason to celebrate as the ancient and beloved tradition of the Pharaz an-Dâira returns to [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]!\n\nOur capital will be the greatest in all the world thanks to #EMP my#! efforts, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] receives a constant flow of cheap grain from [GetGeographicalRegion('custom_anbalkumagan').GetName], just like it did centuries ago.\n\nAnd as the ancient poet aptly said, all we need to keep the common people happy is bread and games!"
 pharazain_events.8.a: "Let them eat bread!"
 reconfirm_anbalkumagan_grain_dole_decision: "Reconfirm the Pharaz an-Dâira"
 reconfirm_anbalkumagan_grain_dole_decision_desc: "After its formal reintroduction, the citizens of [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] have grown accustomed to the luxuries offered by the Pharaz an-Dâira — the regular distributions of free or price-controlled bread. It is a powerful instrument in the hands of any Emperor to ensure their people's productivity and their own popularity."
 reconfirm_anbalkumagan_grain_dole_decision_tooltip: "Reconfirm the bread distributions to the people of the capital"
