 ##Game Concepts
 game_concept_gimilziran: "Gimilattô"
 game_concept_gimilziran_desc: "Gimilattô, known as the Star Father, was the would-be founder of the High Kingdom of [thanihazad|E] and a formidable conqueror who, for a time, held vast swaths of the [sevenlands|E] under his banner. \n\nHe was raised in [numenor|E] during the rise of the Shadow and became a leader among the [faithful|E] [numenoreans|E] exiled from Andúnië. Believing his life to be a mission in service to [iluvatar|E] and the [valargods|E], Gimilattô sought tirelessly to rekindle the light of [eru|E] among those who had turned away. When the Great Armament was summoned, he defied Ar-Pharazôn’s command and fled to Nindamas, where he secretly prepared ships. Warned by his friend [elendil|E] of Amandil’s vision of the [downfallofnumenor|E], Gimilattô and his sons narrowly escaped the cataclysm in a small fleet of vessels carrying their followers. He made landfall in Mispír, ancestral seat of his house, whose forebears once ruled Zimrathâni. \n\nFrom this refuge, he launched his campaign of conquest. Rallying the survivors of [numenor|E], Gimilattô rapidly took control of the Kingdom of Zimrathâni, establishing it as the heart of his new realm. On the outskirts of Mispír, he began constructing a grand palace, envisioning it as the core of a city that would mirror the lost beauty of Andúnië. Declaring himself High King of [thanihazad|E], he demanded fealty from the lords of the [sevenlands|E] and called upon them to renounce the ways of the [kingsmen|E]. This bold proclamation, however, proved his undoing. The nascent [balan_lai|E], viewing Gimilattô as both a heretic and existential threat, launched a full-scale invasion. A simultaneous uprising of native [kingsmen|E] shattered his fragile hold on power. Within just a century, Gimilattô’s dream lay in ruins. He and his son Izinduzôr fell in the bloody Battle of Tharazârûl, ending his short-lived reign. Though his grandson, Adûnafazor, attempted to rekindle the flame of his legacy, he too perished in battle a few years later. Thus the vision of a [faithful|E] [thanihazad|E] was extinguished forever. The war was a total loss, and Gimilattô, along with his son and grandson, were laid to rest in a hidden tomb deep beneath the Gimilzîr Palace."
 
 ##Game Rules
 rule_dunedain_bon_rule: "$lotr_gr_prefix$Unified Dunedain - The [bloodofnumenor|E]"
 setting_default_bon: "BoN - Default"
 setting_default_bon_desc: "You will be able to increase your [bloodofnumenor|E] trait through a select few Decisions."
 setting_lore_accurate_bon: "BoN - Lore Accurate"
 setting_lore_accurate_bon_desc: "You will not be able to increase your [bloodofnumenor|E] trait, as the strength of [men|E] ever fades."
 setting_half_bon: "BoN - Half"
 setting_half_bon_desc: "You will be able to increase your [bloodofnumenor|E] trait through a select few Decisions, but in a much diminished capacity compared to Default."

 rule_non_sauron_evil_strength_rule: "$lotr_gr_prefix$Unified Dunedain - Evil Strength"
 setting_weakened_evil_strength: "#high Weakened#!"
 setting_weakened_evil_strength_desc: "Every Evil aligned ruler is weakened, allowing Good to prosper."
 setting_default_evil_strength: "Default"
 setting_default_evil_strength_desc: "Evil aligned rulers has no buffs or debuffs."
 setting_strong_evil_strength: "#high Gaining Strength#!"
 setting_strong_evil_strength_desc: "Every Evil aligned ruler is given buffs and will be harder to defeat."
 setting_very_strong_evil_strength: "#high Great and Terrible#!"
 setting_very_strong_evil_strength_desc: "Every Evil aligned ruler is given significant buffs. Those of good heart should despair."
 setting_apocalyptic_evil_strength: "#high Lords of the Earth#!"
 setting_apocalyptic_evil_strength_desc: "There is no hope against Evil, for the darkness of [morgothcharacter|E] is eternal."

 rule_is_dominion_evil_rule: "$lotr_gr_prefix$Unified Dunedain - Dominion of Dark Strength"
 setting_no_they_arent: "Dominion of Dark is Not Evil"
 setting_no_they_arent_desc: "Dominion of Dark rulers will not gain the Evil Strength buffs."
 setting_yes_they_are: "Dominion of Dark is Evil"
 setting_yes_they_are_desc: "Dominion of Dark rulers will gain the Evil Strength buffs. May [eru|E] have mercy."

 evil_weakened_modifier: "Evil: Weakened"
 evil_strengthened_1_modifier: "Evil: Gaining Strength"
 evil_strengthened_2_modifier: "Evil: Great and Terrible"
 evil_strengthened_3_modifier: "Evil: Lords of the Earth"

 rule_enable_harder_to_colonize: "$lotr_gr_prefix$Unified Dunedain - Harder Colonization"
 setting_harder_to_colonize: "Harder Colonization Enabled"
 setting_harder_to_colonize_desc: "Colonization will be more difficult for [elves|E], [dwarves|E], and [dunedain|E]/[adunai|E]. Gives all [counties|E] colonized by these peoples a modifier which will increase building cost, decrease building speed, and decrease county development growth."
 setting_no_harder_to_colonize: "Harder Colonization Disabled"
 setting_no_harder_to_colonize_desc: "Colonization will be the same as vanilla Realms in Exile."

 custom_harder_to_colonize_elven: "Elven Colonization"
 custom_harder_to_colonize_elven_desc: "The [elves|E], eldest and fairest of the Children of Ilúvatar, are colonizing this province. Yet their dwindling numbers render the settling of these wild lands a slow and laborious endeavor."
 custom_harder_to_colonize_dwarven: "Dwarven Colonization"
 custom_harder_to_colonize_dwarven_desc: "The [dwarves|E], finest craftsmen of all of [middleearth|E], are colonizing this province. Yet their dwindling numbers render the settling of these wild lands a slow and laborious endeavor."
 custom_harder_to_colonize_dunedain: "Numenorean Colonization"
 custom_harder_to_colonize_dunedain_desc: "The [numenoreans|E], or their descendents, wisest and greatest of the [men|E] of [middleearth|E], are colonizing this province. Yet their dwindling numbers render the settling of these wild lands a slow and laborious endeavor."


 ##Nicknames
  nick_bearer_of_light: "Nimruzîr" 
  nick_bearer_of_light_desc: "[gimilziran|E] was often known as Nimruzîr, or Elf Friend, for his attempted conversion of [thanihazad|E] into a land of the [faithful|E], and his friendship with the [cuind|E] [elves|E]. His fervor was legendary, and his devotion to [erutheone|E] was unwavering, which ultimately led to his downfall."

